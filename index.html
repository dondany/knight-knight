<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Knight Knight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
:root{--u:4px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#090a14;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'Jersey 10',ui-monospace,Menlo,Consolas,monospace;color:#ebede9;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:calc(var(--u)*320);height:calc(var(--u)*180);overflow:hidden;background:#151d28}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{position:absolute}
.hide{display:none!important}
img.ic{width:calc(var(--u)*9);height:calc(var(--u)*9);image-rendering:pixelated;vertical-align:middle}

#hud{left:calc(var(--u)*4);top:calc(var(--u)*2);display:flex;gap:calc(var(--u)*7);align-items:center;font-size:calc(var(--u)*10);line-height:1;text-shadow:0 calc(var(--u)*1) 0 #090a14}
#hud .stat{display:flex;align-items:center;gap:calc(var(--u)*2)}
#hud small{font-size:.7em;opacity:.7}
#hudr{right:calc(var(--u)*4);top:calc(var(--u)*2);display:flex;gap:calc(var(--u)*2)}

.btn{font:inherit;font-size:calc(var(--u)*7.5);line-height:1;color:#ebede9;background:#3c5e8b;border:0;padding:calc(var(--u)*2.5) calc(var(--u)*4) calc(var(--u)*3);cursor:pointer;pointer-events:auto;
  box-shadow:inset 0 calc(var(--u)*1) 0 #4f8fba,inset 0 calc(var(--u)*-1) 0 #253a5e,0 0 0 calc(var(--u)*1) #090a14;text-shadow:0 calc(var(--u)*.75) 0 #172038;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(calc(var(--u)*1))}
.btn:focus-visible{outline:calc(var(--u)*1) solid #ebede9;outline-offset:calc(var(--u)*1)}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:default}
.btn.gold{background:#be772b;box-shadow:inset 0 calc(var(--u)*1) 0 #de9e41,inset 0 calc(var(--u)*-1) 0 #884b2b,0 0 0 calc(var(--u)*1) #090a14;text-shadow:0 calc(var(--u)*.75) 0 #602c2c}
.btn.red{background:#a53030;box-shadow:inset 0 calc(var(--u)*1) 0 #cf573c,inset 0 calc(var(--u)*-1) 0 #752438,0 0 0 calc(var(--u)*1) #090a14;text-shadow:0 calc(var(--u)*.75) 0 #411d31}
.btn.ice{background:#4f8fba;box-shadow:inset 0 calc(var(--u)*1) 0 #73bed3,inset 0 calc(var(--u)*-1) 0 #3c5e8b,0 0 0 calc(var(--u)*1) #090a14}
.btn.sm{font-size:calc(var(--u)*6);padding:calc(var(--u)*1.5) calc(var(--u)*2.5) calc(var(--u)*2)}
.btn.on{background:#de9e41;color:#241527;text-shadow:none}
.btn img{width:calc(var(--u)*6);height:calc(var(--u)*6);image-rendering:pixelated;vertical-align:calc(var(--u)*-1);margin-left:calc(var(--u)*1)}

#syn{left:calc(var(--u)*4);top:calc(var(--u)*17);width:calc(var(--u)*68)}
.syn-row{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1) calc(var(--u)*2);margin-bottom:calc(var(--u)*1);background:rgba(9,10,20,.78);border-left:calc(var(--u)*1.5) solid var(--c);font-size:max(10px,calc(var(--u)*5.6));line-height:1.1;color:#819796;cursor:help;pointer-events:auto}
.syn-row.on{color:#ebede9}
.syn-row .n{margin-left:auto}
.syn-row.on .n{color:var(--c)}
.syn-hint{font-size:max(10px,calc(var(--u)*5.2));color:#819796;background:rgba(9,10,20,.6);padding:calc(var(--u)*2);line-height:1.25}

#info{right:calc(var(--u)*4);top:calc(var(--u)*17);width:calc(var(--u)*88);background:rgba(9,10,20,.9);box-shadow:0 0 0 calc(var(--u)*1) #394a50;padding:calc(var(--u)*3);font-size:max(10px,calc(var(--u)*5.6));line-height:1.15}
#info.battle{right:auto;left:50%;transform:translateX(-50%);top:calc(var(--u)*30)}
#info .nm{display:flex;justify-content:space-between;font-size:1.4em;color:#e8c170}
#info .lv{color:#ebede9;font-weight:400;font-size:.8em}
#info .sub{color:#a8b5b2;margin:calc(var(--u)*.5) 0 calc(var(--u)*1.5)}
#info .sub i{display:inline-block;width:.6em;height:.6em;margin-right:.4em}
#info .st{display:flex;gap:calc(var(--u)*2);align-items:center;margin-bottom:calc(var(--u)*1.5)}
#info .st b{padding:0 calc(var(--u)*2);color:#ebede9}
#info .st .a{background:#577277}#info .st .h{background:#a53030}
#info .st span{color:#819796}
#info .ab em{font-style:normal;color:#73bed3}
#info b{font-weight:400}
#info .ab b{color:#e8c170}
#info .gr{margin-top:calc(var(--u)*1.5);color:#a8ca58}
#info .hint{margin-top:calc(var(--u)*1.5);color:#819796}
#info .tier{margin-top:calc(var(--u)*1.5);color:#819796}
#info .tier.on{color:#ebede9}
#info .tier b{color:var(--c)}

.lbl{font-size:max(9px,calc(var(--u)*5));color:#a8b5b2;text-shadow:0 calc(var(--u)*.75) 0 #090a14;white-space:nowrap}
#lblFront{transform:translateX(-50%);color:#e8c170}
#lblShop{left:calc(var(--u)*24);top:calc(var(--u)*119)}
#shopbar{left:0;right:0;top:calc(var(--u)*162);height:calc(var(--u)*14)}
#shopbar>*{position:absolute;top:0}
#btnRoll{left:calc(var(--u)*24)}
#ctx{left:50%;transform:translateX(-50%);display:flex;gap:calc(var(--u)*3)}
#btnEnd{right:calc(var(--u)*8)}
#sellzone{left:calc(var(--u)*20);right:calc(var(--u)*20);top:calc(var(--u)*114);height:calc(var(--u)*46);background:rgba(165,48,48,.5);box-shadow:inset 0 0 0 calc(var(--u)*1) #cf573c;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*11);text-shadow:0 calc(var(--u)*1) 0 #411d31}

#bnames{left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*15);display:flex;justify-content:space-between;align-items:flex-start;font-size:calc(var(--u)*9);line-height:1;text-shadow:0 calc(var(--u)*1) 0 #090a14}
#bnames .r{text-align:right}
#bnames .vs{color:#e8c170;font-size:.8em;padding-top:calc(var(--u)*1)}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.5);margin-top:calc(var(--u)*1.5);font-size:max(9px,calc(var(--u)*5.2));font-weight:400;text-shadow:none;max-width:calc(var(--u)*110)}
.r .chips{justify-content:flex-end}
.chip{background:rgba(9,10,20,.8);border-left:calc(var(--u)*1.5) solid var(--c);padding:0 calc(var(--u)*1.5)}
#bbar{left:50%;transform:translateX(-50%);top:calc(var(--u)*164);display:flex;gap:calc(var(--u)*2)}

#fl{inset:0}
.fl{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--u)*8);line-height:1;white-space:nowrap;text-shadow:calc(var(--u)*.75) calc(var(--u)*.75) 0 #090a14,calc(var(--u)*-.75) calc(var(--u)*-.75) 0 #090a14,calc(var(--u)*.75) calc(var(--u)*-.75) 0 #090a14,calc(var(--u)*-.75) calc(var(--u)*.75) 0 #090a14;animation:rise .95s ease-out forwards}
.fl.dmg{color:#cf573c;font-size:calc(var(--u)*10)}
.fl.buff{color:#a8ca58}
.fl.debuff{color:#c65197}
.fl.gold{color:#e8c170}
.fl.ab{color:#ebede9;font-size:calc(var(--u)*6.5);animation-duration:1.1s}
.fl.syn{color:var(--c,#73bed3);font-size:calc(var(--u)*8)}
.fl.block{color:#73bed3}
.fl.big{font-size:calc(var(--u)*14);color:#e8c170;animation-duration:1.8s}
.fl.err{color:#cf573c;font-size:calc(var(--u)*9);animation-duration:1.3s}
@keyframes rise{0%{opacity:0;margin-top:calc(var(--u)*3)}15%{opacity:1}70%{opacity:1}100%{opacity:0;margin-top:calc(var(--u)*-10)}}

#banner{inset:0;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--u)*34);gap:calc(var(--u)*3);background:linear-gradient(rgba(9,10,20,.7),rgba(9,10,20,.25) 55%,rgba(9,10,20,.5));pointer-events:auto}
#btnCont{position:absolute;left:50%;top:calc(var(--u)*158);transform:translateX(-50%)}
#btnCont:active{transform:translate(-50%,calc(var(--u)*1))}
#banner h2{margin:0;font-weight:400;font-size:calc(var(--u)*36);line-height:1;text-shadow:0 calc(var(--u)*2) 0 #090a14;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
#banner p{margin:0;font-size:calc(var(--u)*8);color:#c7cfcc}
#banner.win h2{color:#e8c170}#banner.lose h2{color:#cf573c}#banner.draw h2{color:#a8b5b2}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

#title{inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
#title h1{margin:calc(var(--u)*20) 0 0;font-weight:400;font-size:calc(var(--u)*50);line-height:.9;letter-spacing:calc(var(--u)*1);color:#e8c170;text-shadow:0 calc(var(--u)*2) 0 #be772b,0 calc(var(--u)*4) 0 #602c2c,0 calc(var(--u)*6) 0 #090a14}
#title p{margin:calc(var(--u)*9) 0 calc(var(--u)*7);font-size:calc(var(--u)*8);color:#a8b5b2;text-shadow:0 calc(var(--u)*1) 0 #090a14}
#title .row{display:flex;gap:calc(var(--u)*4)}

#modal{inset:0;display:flex;align-items:center;justify-content:center;background:rgba(9,10,20,.75);pointer-events:auto}
#modal .box{max-width:calc(var(--u)*230);max-height:92%;overflow:auto;background:#151d28;box-shadow:0 0 0 calc(var(--u)*1) #577277,0 0 0 calc(var(--u)*2) #090a14;padding:calc(var(--u)*6);font-size:max(11px,calc(var(--u)*6.2));line-height:1.15;text-align:center}
#modal h2{margin:0 0 calc(var(--u)*4);font-weight:400;font-size:calc(var(--u)*16);line-height:1;color:#e8c170}
#modal ul{margin:0 0 calc(var(--u)*5);padding-left:1.2em;text-align:left}
#modal li{margin-bottom:calc(var(--u)*1.5)}
#modal li b{color:#e8c170;font-weight:400}
#modal p{margin:0 0 calc(var(--u)*5);color:#c7cfcc}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="ui">
    <div id="hud" class="hide">
      <span class="stat" title="Gold"><img class="ic" data-ic="coin" alt="Gold"><span id="hGold">10</span></span>
      <span class="stat" title="Lives"><img class="ic" data-ic="heart" alt="Lives"><span id="hLives">5</span></span>
      <span class="stat" title="Wins"><img class="ic" data-ic="trophy" alt="Wins"><span id="hWins">0</span><small>/10</small></span>
      <span class="stat"><small>TURN</small><span id="hTurn">1</span></span>
    </div>
    <div id="hudr">
      <button class="btn sm" id="btnHelp" aria-label="How to play">?</button>
      <button class="btn sm" id="btnMute" aria-label="Toggle sound">♪</button>
    </div>
    <div id="syn" class="hide"></div>
    <div id="info" class="hide"></div>
    <div id="lblFront" class="lbl hide">FRONT</div>
    <div id="lblShop" class="lbl hide"></div>
    <div id="sellzone" class="hide"></div>
    <div id="shopbar" class="hide">
      <button class="btn" id="btnRoll">Roll <img data-ic="coin" alt="">1</button>
      <div id="ctx"></div>
      <button class="btn gold" id="btnEnd">End Turn ▸</button>
    </div>
    <div id="bnames" class="hide"><div class="l"><div>Your Army</div><div class="chips" id="chipsL"></div></div><div class="vs">VS</div><div class="r"><div id="oppName"></div><div class="chips" id="chipsR"></div></div></div>
    <div id="bbar" class="hide">
      <button class="btn sm" data-speed="1">1×</button><button class="btn sm" data-speed="2">2×</button><button class="btn sm" data-speed="4">4×</button><button class="btn sm" id="btnSkip">Skip ▸▸</button>
    </div>
    <div id="fl"></div>
    <div id="banner" class="hide"><h2 id="bannerT"></h2><p id="bannerP"></p><button class="btn gold" id="btnCont">Continue ▸</button></div>
    <div id="title" class="hide">
      <h1>KNIGHT KNIGHT</h1>
      <p>Draft an army from across history. Let them fight it out.</p>
      <div class="row"><button class="btn gold" id="btnNew">New Game</button><button class="btn hide" id="btnLoad">Continue</button><button class="btn" id="btnHow">How to Play</button></div>
    </div>
    <div id="modal" class="hide"><div class="box" id="modalBox"></div></div>
  </div>
</div>
<script>
'use strict';
//#region LOGIC ============================================================
// Pure game rules: no DOM in this region (it is also run headless for balance sims).
const CAP = 50, COST = 3, LIVES = 5, WINS = 10;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeRng(seed){
  const f = mulberry32(seed);
  f.int = n => Math.floor(f()*n);
  f.pick = a => a[f.int(a.length)];
  f.shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=f.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
  return f;
}

const FACTIONS = {
  medieval:{name:'Medieval', color:'#4f8fba', syn:'Tithe',      tiers:['+1 gold at the start of every turn.','+3 gold at the start of every turn.']},
  viking:  {name:'Vikings',  color:'#75a743', syn:'Blood Rage', tiers:['When a Viking faints, the other Vikings gain +1/+1.','When a Viking faints, the other Vikings gain +2/+2.']},
  spartan: {name:'Spartans', color:'#cf573c', syn:'Phalanx',    tiers:['Spartans take 1 less damage (min 1).','Spartans take 2 less damage (min 1).']},
  egypt:   {name:'Egyptians',color:'#e8c170', syn:'Afterlife',  tiers:['The first Egyptian to faint rises as a Mummy with half its stats.','Every Egyptian rises once as a Mummy with half its stats.']},
  roman:   {name:'Romans',   color:'#c65197', syn:'Drill',      tiers:['End of turn: a random Roman gains +1/+1 for good.','End of turn: every Roman gains +1/+1 for good.']},
  japan:   {name:'Japanese', color:'#df84a5', syn:'Bushido',    tiers:['Each Japanese unit deals +2 damage with its first attack.','Each Japanese unit deals +5 damage with its first attack.']},
  merc:    {name:'Mercenaries', color:'#a8b5b2', syn:'Wild',    tiers:['Counts as a member of every army you field.','']},
};
const REAL_F = ['medieval','viking','spartan','egypt','roman','japan'];

const UNITS = {};
// sprite origin is col*16,row*16 unless overridden with sx/sy (two sprites spill over their cell)
function def(key,name,faction,tier,atk,hp,col,row,pos,ability,text,extra){
  UNITS[key] = Object.assign({key,name,faction,tier,atk,hp,sx:col*16,sy:row*16,pos,ability,text}, extra);
}
const MUMMY = {name:'Mummy', faction:'egypt', tier:0, ability:'Risen', text:'A hollow husk. No ability.'};

let UID = 1;
function lvlOf(u){return u.xp>=5?3:u.xp>=2?2:1}
function mkUnit(key){const d=UNITS[key];return{uid:UID++,key,atk:d.atk,hp:d.hp,xp:0,gear:null}}
function pbuff(P,u,da,dh){u.atk=Math.min(CAP,u.atk+da);u.hp=Math.min(CAP,u.hp+dh);P.fx.push({k:'buff',uid:u.uid,da,dh})}

// --- Medieval ---
def('peasant','Peasant','medieval',1,3,1, 2,0, 0,'Harvest','Sell: gain {1|2|3} extra gold.',
  {shop:{sell(u,P){const n=lvlOf(u);P.gold+=n;P.fx.push({k:'gold',n})}}});
def('longbow','Longbowman','medieval',2,2,2, 0,0, 2,'Volley','Start of battle: deal {2|4|6} damage to the rearmost enemy.',
  {on:{start(u,B){const f=B.foes(u);if(!f.length)return;B.say(u);B.shoot(u,[f[f.length-1]],2*u.lvl)}}});
def('knight','Knight','medieval',3,3,4, 1,0, 0,'Plate Armor','Blocks the first {hit|2 hits|3 hits} it takes each battle.',{blocks:true});
def('halberdier','Halberdier','medieval',4,4,5, 4,0, 0,'Reach','Before attack: deal {3|6|9} damage to the enemy behind the front.',
  {on:{beforeAttack(u,B){const f=B.foes(u);if(!f[1])return;B.say(u);B.shoot(u,[f[1]],3*u.lvl)}}});
def('king','King','medieval',6,5,7, 3,0, 2,'Royal Decree','Start of battle: give every other friend {+2/+2|+4/+4|+6/+6}.',
  {on:{start(u,B){const a=B.allies(u).filter(x=>x!==u);if(!a.length)return;B.say(u);B.buffAll(a,2*u.lvl,2*u.lvl)}}});
// --- Vikings ---
def('raider','Raider','viking',1,2,1, 0,1, 0,'Last Gift','Faint: give a random friend {+2/+1|+4/+2|+6/+3}.',
  {on:{faint(u,B){const a=B.allies(u);if(!a.length)return;B.say(u);B.buff(B.rng.pick(a),2*u.lvl,u.lvl)}}});
def('berserker','Berserker','viking',2,2,4, 1,1, 0,'Fury','Hurt: gain {+2|+4|+6} attack.',
  {on:{hurt(u,B){B.say(u);B.buff(u,2*u.lvl,0)}}});
def('huscarl','Huscarl','viking',3,3,4, 2,1, 1,'Avenger','Friend ahead faints: gain {+2/+2|+4/+4|+6/+6}.',
  {on:{friendAheadFaints(u,B){B.say(u);B.buff(u,2*u.lvl,2*u.lvl)}}});
def('skald','Skald','viking',4,2,4, 4,1, 2,'War Horn','Start of battle: give all friends ahead {+1/+1|+2/+2|+3/+3}.',
  {on:{start(u,B){const a=B.allies(u),i=a.indexOf(u);if(i<1)return;B.say(u);B.buffAll(a.slice(0,i),u.lvl,u.lvl)}}});
def('jarl','Jarl','viking',5,6,6, 3,1, 0,'Rampage','Knockout: deal {5|10|15} damage to the next enemy.',
  {on:{knockout(u,B){const f=B.foes(u);if(!f.length)return;B.say(u);B.shoot(u,[f[0]],5*u.lvl)}}});
// --- Spartans ---
def('peltast','Peltast','spartan',1,2,2, 3,2, 2,'Javelins','Start of battle: deal 1 damage to {1 random enemy|2 random enemies|3 random enemies}.',
  {on:{start(u,B){const f=B.foes(u);if(!f.length)return;B.say(u);B.shoot(u,B.rng.shuffle(f).slice(0,u.lvl),1)}}});
def('hoplite','Hoplite','spartan',2,2,3, 0,2, 1,'Spear Wall','Friend ahead attacks: deal {1|2|3} damage to the front enemy.',
  {on:{friendAheadAttacks(u,B){const f=B.foes(u);if(!f.length)return;B.say(u);B.shoot(u,[f[0]],u.lvl)}}});
def('phalangite','Phalangite','spartan',3,2,6, 1,2, 0,'Aspis','Takes {1|2|3} less damage from every hit (min 1).',{armor:true});
def('lochagos','Lochagos','spartan',4,3,5, 4,2, 1,'Hold the Line','Start of battle: give adjacent friends {+1/+3|+2/+6|+3/+9}.',
  {on:{start(u,B){const a=B.allies(u),i=a.indexOf(u),t=[a[i-1],a[i+1]].filter(Boolean);if(!t.length)return;B.say(u);B.buffAll(t,u.lvl,3*u.lvl)}}});
def('leonidas','Leonidas','spartan',6,7,7, 2,2, 0,'This is Sparta!','Start of battle: kick the front enemy to the back of their line for {5|10|15} damage.',
  {on:{start(u,B){const f=B.foes(u);if(!f.length)return;B.say(u);B.kick(f[0]);B.hit(f[0],5*u.lvl,u)}}});
// --- Egyptians ---
def('laborer','Laborer','egypt',1,1,3, 0,3, 1,'Tribute','Buy: give a random friend {+1/+1|+2/+2|+3/+3}.',
  {shop:{buy(u,P,rng){const o=P.team.filter(x=>x&&x!==u);if(o.length){const l=lvlOf(u);pbuff(P,rng.pick(o),l,l)}}}});
def('medjay','Medjay','egypt',2,2,3, 3,3, 0,'Embalmed','Faint: rise as a {2/2|4/4|6/6} Mummy.',
  {on:{faint(u,B,i){B.say(u);B.summon(u.side,i,{key:u.key,atk:2*u.lvl,hp:2*u.lvl,mummy:true})}}});
def('priest','Priest of Set','egypt',3,2,4, 1,3, 2,'Curse','Start of battle: the strongest enemy loses {3|6|9} attack (min 1).',
  {on:{start(u,B){const f=B.foes(u);if(!f.length)return;const t=f.reduce((a,b)=>b.atk>a.atk?b:a);B.say(u);B.buff(t,-3*u.lvl,0)}}});
def('cleopatra','Cleopatra','egypt',5,4,5, 4,3, 1,'Asp','After attack: deal {4|8|12} damage to the weakest enemy.',
  {on:{afterAttack(u,B){const f=B.foes(u);if(!f.length)return;const t=f.reduce((a,b)=>b.hp<a.hp?b:a);B.say(u);B.shoot(u,[t],4*u.lvl)}}});

const UNIT_KEYS = Object.keys(UNITS);

const ITEMS = {
  ration:   {name:'Ration',      tier:1, text:'Give a unit +1/+1.'},
  whetstone:{name:'Whetstone',   tier:2, gear:true, text:'Gear: attacks deal +3 damage.'},
  chainmail:{name:'Chainmail',   tier:3, gear:true, text:'Gear: take 2 less damage (min 1).'},
  feast:    {name:'Feast',       tier:4, noTarget:true, text:'Give 3 random units +1/+1.'},
  manual:   {name:'War Manual',  tier:4, text:'Give a unit +1 experience.'},
  shield:   {name:'Tower Shield',tier:5, gear:true, text:'Gear: block the first hit each battle.'},
  ankh:     {name:'Ankh',        tier:6, gear:true, text:'Gear: once per battle, return from death as a 1/1.'},
};
const ITEM_KEYS = Object.keys(ITEMS);

// Mercenaries are wild: they add +1 to every army that has at least one real member.
function synergies(units){
  const real={}; let wild=0;
  for(const u of units){ if(!u) continue; const f=UNITS[u.key].faction; if(f==='merc') wild++; else real[f]=(real[f]||0)+1; }
  const out={};
  for(const f in real){ const n=real[f]+wild; out[f]={n, lvl:n>=4?2:n>=2?1:0}; }
  return out;
}

// ---------- shop phase ----------
const tierForTurn = t => Math.min(6, Math.floor((t+1)/2));
const shopSize = t => t>=9?5:t>=5?4:3;
const itemSlots = t => t>=5?2:1;
function newPlayer(){return{gold:10,turn:1,lives:LIVES,wins:0,team:[null,null,null,null,null],shop:[],items:[],fx:[]}}
function canMerge(a,b){return a&&b&&a!==b&&a.key===b.key&&lvlOf(a)<3}

function refill(P,rng){
  const T=tierForTurn(P.turn), pool=UNIT_KEYS.filter(k=>UNITS[k].tier<=T), ipool=ITEM_KEYS.filter(k=>ITEMS[k].tier<=T);
  P.shop=P.shop.filter(s=>s.frozen); while(P.shop.length<shopSize(P.turn)) P.shop.push({u:mkUnit(rng.pick(pool)),frozen:false});
  P.items=P.items.filter(s=>s.frozen); while(P.items.length<itemSlots(P.turn)) P.items.push({item:rng.pick(ipool),frozen:false});
}
function startTurn(P,rng){
  const s=synergies(P.team).medieval, tithe=[0,1,3][s?s.lvl:0];
  P.gold=10+tithe; if(tithe) P.fx.push({k:'gold',n:tithe,label:'Tithe'});
  refill(P,rng);
}
function rollShop(P,rng){ if(P.gold<1) return false; P.gold--; refill(P,rng); return true; }
function levelUp(P,t,rng){
  P.fx.push({k:'level',uid:t.uid});
  if(P.shop.length<6){ const T=Math.min(6,tierForTurn(P.turn)+1); P.shop.push({u:mkUnit(rng.pick(UNIT_KEYS.filter(k=>UNITS[k].tier===T))),frozen:false,bonus:true}); }
}
function mergeInto(P,t,inc,rng){
  const before=lvlOf(t);
  t.atk=Math.min(CAP,Math.max(t.atk,inc.atk)+1); t.hp=Math.min(CAP,Math.max(t.hp,inc.hp)+1);
  t.xp=Math.min(5,t.xp+inc.xp+1); if(!t.gear) t.gear=inc.gear;
  if(lvlOf(t)>before) levelUp(P,t,rng);
}
// free up `slot` by sliding its neighbours toward the nearest gap
function makeRoom(P,slot){
  const t=P.team; if(!t[slot]) return true;
  let gap=-1; for(let i=0;i<5;i++) if(!t[i]&&(gap<0||Math.abs(i-slot)<Math.abs(gap-slot))) gap=i;
  if(gap<0) return false;
  if(gap>slot) for(let i=gap;i>slot;i--) t[i]=t[i-1]; else for(let i=gap;i<slot;i++) t[i]=t[i+1];
  t[slot]=null; return true;
}
function canBuyInto(P,u,slot){ return canMerge(P.team[slot],u) || P.team.includes(null); }
function buyUnit(P,si,slot,rng){
  const s=P.shop[si]; if(!s||P.gold<COST) return null;
  const u=s.u, t=P.team[slot]; let res;
  if(canMerge(t,u)){ P.gold-=COST; P.shop.splice(si,1); mergeInto(P,t,u,rng); res=t; }
  else{ if(!makeRoom(P,slot)) return null; P.gold-=COST; P.shop.splice(si,1); P.team[slot]=u; res=u; }
  const h=UNITS[res.key].shop; if(h&&h.buy) h.buy(res,P,rng);
  return res;
}
function sellUnit(P,slot,rng){
  const u=P.team[slot]; if(!u) return false;
  P.team[slot]=null; const n=lvlOf(u); P.gold+=n; P.fx.push({k:'gold',n});
  const h=UNITS[u.key].shop; if(h&&h.sell) h.sell(u,P,rng);
  return true;
}
function moveUnit(P,a,b,rng){
  if(a===b) return false; const ua=P.team[a], ub=P.team[b]; if(!ua) return false;
  if(canMerge(ub,ua)){ mergeInto(P,ub,ua,rng); P.team[a]=null; } else { P.team[a]=ub; P.team[b]=ua; }
  return true;
}
function canUseItem(P,key,slot){
  const u=P.team[slot];
  if(ITEMS[key].noTarget) return P.team.some(Boolean);
  if(!u) return false;
  return !(key==='manual'&&lvlOf(u)>=3);
}
function useItem(P,ii,slot,rng){
  const s=P.items[ii]; if(!s||P.gold<COST||!canUseItem(P,s.item,slot)) return false;
  const u=P.team[slot], it=ITEMS[s.item];
  if(it.gear) u.gear=s.item;
  else if(s.item==='ration') pbuff(P,u,1,1);
  else if(s.item==='feast') rng.shuffle(P.team.filter(Boolean)).slice(0,3).forEach(x=>pbuff(P,x,1,1));
  else if(s.item==='manual'){ const b=lvlOf(u); u.xp++; P.fx.push({k:'text',uid:u.uid,text:'+1 XP'}); if(lvlOf(u)>b) levelUp(P,u,rng); }
  P.gold-=COST; P.items.splice(ii,1); return true;
}
function endTurn(P,rng){
  P.team.forEach((u,i)=>{ if(!u) return; const h=UNITS[u.key].shop; if(h&&h.endTurn) h.endTurn(u,P,rng,i); });
  const s=synergies(P.team).roman;
  if(s&&s.lvl){
    const rs=P.team.filter(u=>u&&['roman','merc'].includes(UNITS[u.key].faction));
    (s.lvl>1?rs:[rng.pick(rs)]).forEach(u=>pbuff(P,u,1,1));
  }
}

// ---------- battle ----------
// Returns a flat event log; the view replays it. `q` on an event means "don't pause after this one".
function simulateBattle(TA,TB,seed){
  const rng=makeRng(seed), ev=[], sides=[[],[]], meta=[], dying=[]; let nid=0;
  [TA,TB].forEach((t,s)=>{
    const us=t.filter(Boolean), syn=synergies(us);
    sides[s]=us.map(u=>{const d=UNITS[u.key],l=lvlOf(u);return{id:++nid,key:u.key,def:d,side:s,atk:u.atk,hp:u.hp,hp0:u.hp,lvl:l,gear:u.gear||null,block:(d.blocks?l:0)+(u.gear==='shield'?1:0),dead:false,tb:rng()}});
    meta[s]={syn,afterlife:syn.egypt?[0,1,9][syn.egypt.lvl]:0};
  });
  const snap=u=>({id:u.id,key:u.key,side:u.side,atk:u.atk,hp:u.hp,lvl:u.lvl,gear:u.gear,block:u.block,mummy:!!u.mummy});
  const alive=L=>L.filter(u=>!u.dead);
  // synergy level `u` enjoys for faction f (0 if none)
  const sl=(u,f)=>{const s=meta[u.side].syn[f];if(!s||u.mummy)return 0;const uf=u.def.faction;return(uf===f||uf==='merc')?s.lvl:0};
  const trig=(u,n,a,b)=>{const f=u.def.on&&u.def.on[n];if(f)f(u,B,a,b)};

  function hit(t,amt,src,q){
    if(!t||t.dead) return;
    if(t.block>0){ t.block--; ev.push({t:'block',id:t.id,block:t.block,q:!!q}); return; }
    const red=(t.def.armor?t.lvl:0)+sl(t,'spartan')+(t.gear==='chainmail'?2:0);
    amt=Math.max(1,amt-red); t.hp-=amt;
    ev.push({t:'dmg',id:t.id,amt,hp:Math.max(0,t.hp),q:!!q});
    if(t.hp<=0){ t.dead=true; dying.push(t); } else trig(t,'hurt');
  }
  function summon(side,i,spec){
    const L=sides[side]; if(alive(L).length>=5) return null;
    const d=UNITS[spec.key], l=spec.lvl||1;
    const u={id:++nid,key:spec.key,def:spec.mummy?MUMMY:d,side,atk:spec.atk,hp:spec.hp,hp0:spec.hp,lvl:l,gear:null,block:(!spec.mummy&&d.blocks?l:0),dead:false,risen:true,mummy:!!spec.mummy,tb:0};
    i=Math.min(i,L.length); L.splice(i,0,u); ev.push({t:'summon',side,index:i,unit:snap(u)}); return u;
  }
  const B={rng,
    foes:u=>alive(sides[1-u.side]), allies:u=>alive(sides[u.side]), isF:(u,f)=>!u.mummy&&(u.def.faction===f||(u.def.faction==='merc'&&!!meta[u.side].syn[f])),
    say(u){ev.push({t:'ability',id:u.id,name:u.def.ability})},
    buff(u,da,dh,q){ if(u.dead) return; const a0=u.atk,h0=u.hp; u.atk=Math.max(1,Math.min(CAP,u.atk+da)); u.hp=Math.min(CAP,u.hp+dh); ev.push({t:'buff',id:u.id,da:u.atk-a0,dh:u.hp-h0,atk:u.atk,hp:u.hp,q:!!q}); },
    buffAll(us,da,dh){us.forEach((x,i)=>B.buff(x,da,dh,i<us.length-1))},
    hit, summon,
    shoot(src,ts,amt){ ts=ts.filter(Boolean); if(!ts.length) return; ev.push({t:'shot',from:src.id,to:ts.map(x=>x.id)}); ts.forEach((x,i)=>hit(x,amt,src,i<ts.length-1)); },
    ward(u,n){ u.block+=n; ev.push({t:'status',id:u.id,block:u.block}); },
    kick(t){ const L=sides[t.side]; if(alive(L).length<2) return; L.splice(L.indexOf(t),1); L.push(t); ev.push({t:'order',side:t.side,ids:L.map(x=>x.id),kicked:t.id}); },
  };
  function resolve(){
    let guard=0;
    while(dying.length&&guard++<200){
      const u=dying.shift(), L=sides[u.side], i=L.indexOf(u); if(i<0) continue;
      const behind=L[i+1]; L.splice(i,1); ev.push({t:'faint',id:u.id});
      trig(u,'faint',i);
      if(!u.risen){
        if(u.gear==='ankh') summon(u.side,i,{key:u.key,atk:1,hp:1,lvl:u.lvl});
        if(sl(u,'egypt')&&meta[u.side].afterlife>0){ meta[u.side].afterlife--; ev.push({t:'syn',side:u.side,f:'egypt'}); summon(u.side,i,{key:u.key,atk:Math.ceil(u.atk/2),hp:Math.ceil(u.hp0/2),mummy:true}); }
        const rage=sl(u,'viking'), vs=rage?alive(L).filter(v=>sl(v,'viking')):[];
        if(vs.length){ ev.push({t:'syn',side:u.side,f:'viking'}); B.buffAll(vs,rage,rage); }
      }
      if(behind&&!behind.dead) trig(behind,'friendAheadFaints',u);
      for(const f of alive(L)) trig(f,'friendFaints',u,i);
    }
  }
  const strike=u=>{ let d=u.atk+(u.gear==='whetstone'?3:0)+(u.def.iaido?(u.lvl-1)*3:0); if(!u.struck) d+=[0,2,5][sl(u,'japan')]; return d; };

  ev.push({t:'init',units:[...sides[0],...sides[1]].map(snap)});
  [...sides[0],...sides[1]].filter(u=>u.def.on&&u.def.on.start).sort((x,y)=>y.atk-x.atk||x.tb-y.tb)
    .forEach(u=>{ if(!u.dead){ trig(u,'start'); resolve(); } });

  let rounds=0;
  while(sides[0].length&&sides[1].length&&rounds++<300){
    const a=sides[0][0], b=sides[1][0];
    for(const u of [a,b]) if(!u.ready&&!u.dead){ u.ready=true; trig(u,'beforeAttack'); }
    resolve();
    if(sides[0][0]!==a||sides[1][0]!==b) continue;
    ev.push({t:'attack',a:a.id,b:b.id});
    const da=strike(a), db=strike(b); a.struck=b.struck=true; a.ready=b.ready=false;
    const ia=!!a.def.iaido, ib=!!b.def.iaido;
    if(ia&&!ib){ hit(b,da,a); if(!b.dead) hit(a,db,b); }
    else if(ib&&!ia){ hit(a,db,b); if(!a.dead) hit(b,da,a); }
    else { hit(b,da,a,true); hit(a,db,b); }
    for(const s of [sides[0][1],sides[1][1]]) if(s&&!s.dead) trig(s,'friendAheadAttacks');
    for(const u of [a,b]) if(!u.dead) trig(u,'afterAttack');
    if(b.dead&&!a.dead) trig(a,'knockout');
    if(a.dead&&!b.dead) trig(b,'knockout');
    resolve();
  }
  const result=sides[0].length?(sides[1].length?'draw':'win'):(sides[1].length?'lose':'draw');
  ev.push({t:'end',result});
  return {ev,result,rounds};
}

// ---------- opponents: a greedy bot that plays the same shop as you ----------
function unitValue(u,fav){const d=UNITS[u.key];return u.atk+u.hp+d.tier*3+u.xp*2+(d.faction===fav||d.faction==='merc'?4:0)+(u.gear?2:0)}
function botShop(P,rng,fav){
  let guard=0;
  while(guard++<80){
    let best=null; const consider=c=>{if(!best||c.sc>best.sc)best=c};
    if(P.gold>=COST){
      P.shop.forEach((s,i)=>{
        const d=UNITS[s.u.key], base=d.tier*2+(d.faction===fav||d.faction==='merc'?5:0)+rng()*2;
        const dup=P.team.findIndex(x=>canMerge(x,s.u)), empty=P.team.indexOf(null);
        if(dup>=0) consider({k:'buy',i,slot:dup,sc:base+5});
        else if(empty>=0) consider({k:'buy',i,slot:empty,sc:base+4});
        else{
          let w=-1,wv=1e9; P.team.forEach((x,j)=>{const v=unitValue(x,fav);if(v<wv){wv=v;w=j}});
          const nv=unitValue(s.u,fav); if(nv>wv+1) consider({k:'swap',i,slot:w,sc:base+(nv-wv)*.5});
        }
      });
      if(P.team.filter(Boolean).length>=3) P.items.forEach((s,i)=>{
        const it=ITEMS[s.item]; let slot=-1,sc=3,bv=-1;
        if(it.gear){ P.team.forEach((x,j)=>{if(x&&!x.gear&&x.atk+x.hp>bv){bv=x.atk+x.hp;slot=j}}); sc=5+it.tier; }
        else if(s.item==='manual'){ P.team.forEach((x,j)=>{if(x&&lvlOf(x)<3&&x.xp*10+x.atk+x.hp>bv){bv=x.xp*10+x.atk+x.hp;slot=j}}); sc=6; }
        else if(s.item==='feast'){ slot=P.team.findIndex(Boolean); sc=7; }
        else slot=rng.pick(P.team.map((x,j)=>x?j:-1).filter(j=>j>=0));
        if(slot>=0) consider({k:'item',i,slot,sc:sc+rng()});
      });
    }
    if(best){
      if(best.k==='item') useItem(P,best.i,best.slot,rng);
      else{ if(best.k==='swap') sellUnit(P,best.slot,rng); buyUnit(P,best.i,best.slot,rng); }
    } else if(!rollShop(P,rng)) break;
    P.fx.length=0;
  }
  const us=P.team.filter(Boolean).sort((a,b)=>UNITS[a.key].pos-UNITS[b.key].pos||b.hp-a.hp);
  P.team=[0,1,2,3,4].map(i=>us[i]||null);
}
const ARMY_NAMES = {
  medieval:['The Iron Crown','Lionheart Levy','Black Keep','The Round Table'],
  viking:['Sea Wolves','Ravens of Odin','Frost Raiders','Longship Kin'],
  spartan:['The Three Hundred','The Bronze Wall','Sons of Ares','Crimson Phalanx'],
  egypt:['Sons of Ra','The Nile Guard','Scarab Host','Eternal Dynasty'],
  roman:['Legio IX','Eagles of Rome','The Iron Legion','Praetorians'],
  japan:['Crane Clan','Moonlit Blades','Tiger Shogunate','The Forty-Seven'],
};
function makeOpponent(turn,rng){
  const fav=rng.pick(REAL_F), P=newPlayer(), waste=rng.int(3);
  for(let t=1;t<=turn;t++){ P.turn=t; startTurn(P,rng); P.gold=Math.max(3,P.gold-waste); botShop(P,rng,fav); endTurn(P,rng); P.fx.length=0; }
  // name the army after whatever it actually ended up fielding
  const n={}; P.team.forEach(u=>{ if(u){ const f=UNITS[u.key].faction; if(f!=='merc') n[f]=(n[f]||0)+1; } });
  const top=REAL_F.reduce((a,f)=>(n[f]||0)>(n[a]||0)?f:a,fav);
  return {name:rng.pick(ARMY_NAMES[top]),fav,team:P.team};
}

const W=320, H=180, TEAM_Y=94, SHOP_Y=148, FIELD_Y=128;
const teamX=i=>210-i*30, shopX=j=>38+j*30, itemX=k=>244+k*30;
const slotX=(side,i)=>side?174+i*25:146-i*25;
const $=id=>document.getElementById(id);

    const o=mkCanvas(18,18), og=o.getContext('2d'), im=og.createImageData(18,18);
    const solid=(px,py)=>{ if(px<0||py<0||px>15||py>15) return false; const X=sx+px,Y=sy+py; if(X<0||Y<0||X>=src.width||Y>=src.height) return false;

}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5], BG={};
function dither(x,cols,y0,y1){ const n=cols.length-1; for(let y=y0;y<y1;y++){ const f=(y-y0)/(y1-y0)*n, i=Math.min(n-1,Math.floor(f)), fr=f-i; for(let px=0;px<W;px++){ x.fillStyle=cols[fr>(BAYER[(y&3)*4+(px&3)]+.5)/16?i+1:i]; x.fillRect(px,y,1,1); } } }

function speckle(x,r,y0,y1,cols,n){ for(let i=0;i<n;i++){ x.fillStyle=r.pick(cols); x.fillRect(r.int(W),y0+r.int(y1-y0),1+r.int(2),1); } }

// o: {key,x,y(feet),flip,flash,mummy,alpha,phase,shadow,atk,hp,lvl,xp,gear,block}
function drawUnit(o){
  const s=SPR[o.key]; if(!s) return;
  const img=o.flash?s.w:o.mummy?s.m:s.n, x=Math.round(o.x), y=Math.round(o.y), top=y-17;
  const bob=((G.time+(o.phase||0)*137)/460|0)%2;
  g.globalAlpha=o.alpha==null?1:Math.max(0,o.alpha);
  if(o.shadow){ g.fillStyle='rgba(9,10,20,.45)'; g.fillRect(x-6,y-1,12,2); g.fillRect(x-4,y+1,8,1); }
  g.save(); if(o.flip){ g.translate(x*2,0); g.scale(-1,1); }
  g.drawImage(img,0,0,18,11,x-9,top+bob,18,11); g.drawImage(img,0,11,18,7,x-9,top+11,18,7);
  g.restore();
  if(o.atk!=null){ badge(x-1,y+3,o.atk,'#577277',true); badge(x+1,y+3,o.hp,'#a53030',false); }
  if(o.lvl>1){ g.fillStyle='#090a14'; g.fillRect(x-12,top-1,7,9); g.fillStyle=o.lvl>2?'#cf573c':'#de9e41'; g.fillRect(x-11,top,5,7); digits(o.lvl,x-10,top+1,'#090a14'); }
  if(o.xp!=null&&o.lvl<3){ const n=o.lvl===1?2:3, f=o.lvl===1?o.xp:o.xp-2, px=x-(n*4-1>>1); for(let i=0;i<n;i++){ g.fillStyle='#090a14'; g.fillRect(px+i*4-1,top-5,5,4); g.fillStyle=i<f?'#e8c170':'#394a50'; g.fillRect(px+i*4,top-4,3,2); } }
  if(o.gear&&ICON['g_'+o.gear]){ g.fillStyle='#090a14'; g.fillRect(x+5,top-1,7,7); g.drawImage(ICON['g_'+o.gear],x+6,top); }
  for(let i=0;i<(o.block||0);i++){ g.fillStyle='#090a14'; g.fillRect(x-12,top+9+i*4,4,4); g.fillStyle='#73bed3'; g.fillRect(x-11,top+10+i*4,2,2); }

}
function slab(x,y,top,front,stripe,glow){

// ---------- battle view ----------
const T={clock:0,timers:[],tweens:[],speed:1,skip:false,token:0};
const BV={views:[[],[]],ghosts:{},proj:[],parts:[]};
function wait(ms){ return T.skip?Promise.resolve():new Promise(r=>T.timers.push({t:T.clock+ms,r})); }
function tween(o,p,to,ms,then){ if(T.skip){ o[p]=to; then&&then(); return; } T.tweens.push({o,p,from:o[p],to,t0:T.clock,ms,then}); }
function flushClock(){ let n=0; while((T.tweens.length||T.timers.length)&&n++<50){ T.tweens.splice(0).forEach(w=>{w.o[w.p]=w.to;w.then&&w.then()}); T.timers.splice(0).forEach(x=>x.r()); } }
function tick(dt){
  T.clock+=dt*T.speed;
  for(let i=T.tweens.length-1;i>=0;i--){ const w=T.tweens[i], k=Math.min(1,(T.clock-w.t0)/w.ms); w.o[w.p]=w.from+(w.to-w.from)*k; if(k>=1){ T.tweens.splice(i,1); w.then&&w.then(); } }
  const due=T.timers.filter(x=>x.t<=T.clock); if(due.length){ T.timers=T.timers.filter(x=>x.t>T.clock); due.forEach(x=>x.r()); }
  const k=1-Math.pow(.002,dt*T.speed/400);
  for(const L of BV.views) for(const v of L) v.x+=(v.tx-v.x)*k;
}
const view=id=>BV.views[0].find(v=>v.id===id)||BV.views[1].find(v=>v.id===id);
const vpos=id=>{const v=view(id);return v?{x:v.x+v.ox,y:FIELD_Y}:BV.ghosts[id]||{x:W/2,y:FIELD_Y}};
function layout(side){ BV.views[side].forEach((v,i)=>{ v.tx=slotX(side,i); if(T.skip) v.x=v.tx; }); }
function burst(x,y,col,n){ if(T.skip) return; for(let i=0;i<n;i++) BV.parts.push({x,y,vx:(Math.random()-.5)*.09,vy:-Math.random()*.08-.01,life:300+Math.random()*250,col}); }
const delta=(da,dh)=>da&&dh?`${da>0?'+':''}${da}/${dh>0?'+':''}${dh}`:da?`${da>0?'+':''}${da} ATK`:`${dh>0?'+':''}${dh} HP`;

const PLAY={
  async init(e){
    BV.views=[[],[]]; BV.ghosts={}; BV.proj=[]; BV.parts=[];
    e.units.forEach(s=>{ const L=BV.views[s.side]; L.push(Object.assign({x:s.side?W+24+L.length*14:-24-L.length*14,tx:0,ox:0,oy:0,alpha:1,flash:0,shake:0},s)); });
    layout(0); layout(1); await wait(1100);
  },
  async ability(e){ const p=vpos(e.id), v=view(e.id); floater(p.x,p.y-27,e.name,'ab'); if(v) tween(v,'oy',-4,90,()=>tween(v,'oy',0,90)); sfx('ability'); await wait(430); },
  async shot(e){ const a=vpos(e.from); e.to.forEach(id=>{ const b=vpos(id); if(!T.skip) BV.proj.push({x0:a.x,y0:a.y-9,x1:b.x,y1:b.y-9,t0:T.clock,ms:230}); }); sfx('shot'); await wait(230); },
  async dmg(e){ const v=view(e.id), p=vpos(e.id); if(v){ v.hp=e.hp; v.flash=T.clock+120; v.shake=T.clock+160; } burst(p.x,p.y-9,'#ebede9',5); floater(p.x+(Math.random()*6-3),p.y-22,'-'+e.amt,'dmg'); sfx('hit'); if(!e.q) await wait(340); },
  async block(e){ const v=view(e.id), p=vpos(e.id); if(v) v.block=e.block; burst(p.x,p.y-9,'#73bed3',6); floater(p.x,p.y-22,'BLOCK','block'); sfx('block'); if(!e.q) await wait(340); },
  async buff(e){ const v=view(e.id), p=vpos(e.id); if(v){ v.atk=e.atk; v.hp=e.hp; } if(e.da||e.dh){ const bad=e.da<0||e.dh<0; burst(p.x,p.y-9,bad?'#c65197':'#a8ca58',5); floater(p.x,p.y-22,delta(e.da,e.dh),bad?'debuff':'buff'); sfx('buff'); } if(!e.q) await wait(330); },
  async status(e){ const v=view(e.id), p=vpos(e.id); if(v) v.block=e.block; burst(p.x,p.y-9,'#73bed3',5); await wait(160); },
  async attack(e){ [view(e.a),view(e.b)].forEach(v=>{ if(!v) return; const d=v.side?-1:1; tween(v,'ox',-3*d,110,()=>tween(v,'ox',10*d,70,()=>tween(v,'ox',0,220))); }); await wait(185); },
  async faint(e){ const v=view(e.id); if(!v) return; BV.ghosts[e.id]={x:v.x,y:FIELD_Y}; tween(v,'alpha',0,240); tween(v,'oy',4,240); burst(v.x,FIELD_Y-8,'#a8b5b2',9); sfx('faint'); await wait(250);
    const L=BV.views[v.side], i=L.indexOf(v); if(i>=0) L.splice(i,1); layout(v.side); await wait(140); },
  async summon(e){ const L=BV.views[e.side], v=Object.assign({x:0,tx:0,ox:0,oy:-6,alpha:0,flash:0,shake:0},e.unit); L.splice(Math.min(e.index,L.length),0,v); layout(e.side); v.x=v.tx;
    tween(v,'alpha',1,200); tween(v,'oy',0,200); burst(v.x,FIELD_Y-8,'#d0da91',8); floater(v.x,FIELD_Y-27,v.mummy?'MUMMY':'RETURNS','buff'); sfx('summon'); await wait(380); },
  async order(e){ const L=BV.views[e.side]; L.sort((a,b)=>e.ids.indexOf(a.id)-e.ids.indexOf(b.id)); layout(e.side); const v=view(e.kicked); if(v) tween(v,'oy',-14,170,()=>tween(v,'oy',0,170)); sfx('shot'); await wait(420); },
  async syn(e){ const f=FACTIONS[e.f]; floater(e.side?232:88,FIELD_Y-40,f.syn.toUpperCase(),'syn',f.color); },
  async end(){ await wait(450); },
};
async function playBattle(sim){
  const tok=++T.token;
  for(const e of sim.ev){ if(tok!==T.token) return; if(PLAY[e.t]) await PLAY[e.t](e); if(G.hover&&G.hover.type==='bunit') refreshInfo(); }

}
function renderBattle(){

    drawUnit({key:v.key,x:v.x+v.ox+(T.clock<v.shake?((T.clock/40|0)%2?1:-1):0),y:FIELD_Y+v.oy,flip:side===1,flash:T.clock<v.flash,mummy:v.mummy,alpha:v.alpha,shadow:true,phase:v.id,atk:v.atk,hp:v.hp,lvl:v.lvl,gear:v.gear,block:v.block}); }
  BV.proj=BV.proj.filter(p=>T.clock<p.t0+p.ms);
  for(const p of BV.proj){ const k=(T.clock-p.t0)/p.ms, x=p.x0+(p.x1-p.x0)*k, y=p.y0+(p.y1-p.y0)*k-Math.sin(k*Math.PI)*14; g.fillStyle='#090a14'; g.fillRect(Math.round(x)-1,Math.round(y)-1,4,4); g.fillStyle='#ebede9'; g.fillRect(Math.round(x),Math.round(y),2,2); }

function render(){
  if(G.screen==='shop') renderShop(); else if(G.screen==='battle') renderBattle(); else if(G.screen==='title') renderTitle();
  else { g.fillStyle='#151d28'; g.fillRect(0,0,W,H); }
}
let lastTs=0;
function frame(ts){
  const dt=Math.min(50,ts-lastTs||16); lastTs=ts; G.time+=dt;
  if(G.screen==='battle'){ tick(dt); const s=dt*T.speed; BV.parts=BV.parts.filter(p=>(p.life-=s)>0); for(const p of BV.parts){ p.x+=p.vx*s; p.y+=p.vy*s; p.vy+=.00025*s; } }
  render(); requestAnimationFrame(frame);
}

// ---------- sound ----------
let AC=null;
function tone(f,dur,type,vol,slide,delay){
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), a=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  a.gain.setValueAtTime(vol||.04,t); a.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(a).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
}
const SFX={
  click(){tone(660,.04,'square',.03)}, buy(){tone(523,.07);tone(784,.1,'square',.04,0,.07)}, sell(){tone(988,.06);tone(1319,.12,'square',.04,0,.06)},
  roll(){tone(300,.05,'triangle',.06);tone(400,.05,'triangle',.06,0,.05);tone(500,.06,'triangle',.06,0,.1)}, freeze(){tone(1400,.12,'sine',.05,-600)},
  error(){tone(160,.14,'sawtooth',.04,-40)}, level(){[523,659,784,1047].forEach((f,i)=>tone(f,.11,'square',.04,0,i*.07))},
  hit(){tone(190,.09,'sawtooth',.06,-130)}, block(){tone(900,.07,'square',.04,-300)}, faint(){tone(330,.22,'triangle',.06,-260)},
  buff(){tone(700,.07,'triangle',.05,300)}, ability(){tone(880,.05,'square',.025)}, shot(){tone(1200,.1,'triangle',.04,-800)}, summon(){tone(220,.18,'sine',.06,330)},
  end(){tone(392,.1);tone(294,.16,'square',.04,0,.1)}, win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'square',.045,0,i*.1))},
  lose(){[392,330,262,196].forEach((f,i)=>tone(f,.22,'triangle',.06,0,i*.14))}, draw(){tone(440,.2,'triangle',.05);tone(440,.2,'triangle',.05,0,.22)},
};
function sfx(n){ if(G.muted||T.skip&&G.screen==='battle') return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); SFX[n]&&SFX[n](); }catch(e){} }

// ---------- DOM ui ----------
const show=(id,on)=>$(id).classList.toggle('hide',!on);
function floater(x,y,text,cls,color){
  if(T.skip&&G.screen==='battle') return;
  const d=document.createElement('div'); d.className='fl '+(cls||''); d.textContent=text;
  d.style.left=`calc(var(--u)*${x.toFixed(1)})`; d.style.top=`calc(var(--u)*${Math.max(8,y).toFixed(1)})`; if(color) d.style.setProperty('--c',color);
  $('fl').appendChild(d); setTimeout(()=>d.remove(),1900);
}
const fmt=(text,lvl)=>text.replace(/\{([^}]+)\}/g,(m,s)=>`<b>${s.split('|')[lvl-1]}</b>`);
function unitInfo(u,hint){
  const d=u.mummy?MUMMY:UNITS[u.key], f=FACTIONS[d.faction], lvl=u.lvl||lvlOf(u);
  const xp=u.xp==null||lvl>2?'':`<span>${lvl===1?u.xp:u.xp-2}/${lvl===1?2:3} to Lv ${lvl+1}</span>`;
  return `<div class="nm"><span>${d.name}</span><span class="lv">Lv ${lvl}</span></div>
<div class="sub"><i style="background:${f.color}"></i>${f.name}${d.tier?' · Tier '+d.tier:''}</div>
<div class="st"><b class="a">${u.atk} ATK</b><b class="h">${u.hp} HP</b>${xp}</div>
<div class="ab"><em>${d.ability}.</em> ${fmt(d.text,lvl)}</div>
${u.gear?`<div class="gr">${ITEMS[u.gear].name}: ${ITEMS[u.gear].text.replace('Gear: ','')}</div>`:''}
${hint?`<div class="hint">${hint}</div>`:''}`;
}
function factionInfo(k,n){
  const f=FACTIONS[k], lvl=n>=4?2:n>=2?1:0;
  return `<div class="nm"><span>${f.name}</span><span class="lv">${n} fielded</span></div><div class="sub"><i style="background:${f.color}"></i>Army bonus: ${f.syn}</div>
<div class="tier ${lvl===1?'on':''}" style="--c:${f.color}"><b>(2)</b> ${f.tiers[0]}</div><div class="tier ${lvl===2?'on':''}" style="--c:${f.color}"><b>(4)</b> ${f.tiers[1]}</div>`;
}
function refreshInfo(){
  const P=G.P, h=(G.drag&&G.drag.moved&&G.drag.src)||G.hover||G.sel; let html='';
  if(G.screen==='shop'&&h){
    const e=entityAt(h);
    if(h.type==='faction') html=factionInfo(h.i,(synergies(P.team)[h.i]||{n:0}).n);
    else if(e&&h.type==='team') html=unitInfo(e,`Sells for ${lvlOf(e)} gold.`);
    else if(e&&h.type==='shop') html=unitInfo(e.u,`Costs ${COST} gold.${e.frozen?' Frozen.':''}`);
    else if(e&&h.type==='item'){ const it=ITEMS[e.item]; html=`<div class="nm"><span>${it.name}</span></div><div class="sub">${it.gear?'Gear':'Supply'} · Tier ${it.tier}</div><div class="ab">${it.text}</div><div class="hint">Costs ${COST} gold. ${it.noTarget?'Drop it on your army.':'Drop it on a unit.'}${it.gear?' A unit holds one piece of gear.':''}</div>`; }
  } else if(G.screen==='battle'&&h&&h.type==='bunit'){ const v=view(h.i); if(v) html=unitInfo(v); }
  $('info').innerHTML=html; show('info',!!html); $('info').classList.toggle('battle',G.screen==='battle');
}
function chips(units){ const s=synergies(units); return Object.keys(s).filter(k=>s[k].lvl).map(k=>`<span class="chip" style="--c:${FACTIONS[k].color}">${FACTIONS[k].syn} ${s[k].lvl>1?'II':'I'}</span>`).join(''); }
function setHud(v){ $('hGold').textContent=v.gold; $('hLives').textContent=v.lives; $('hWins').textContent=v.wins; $('hTurn').textContent=v.turn; }
function refreshUI(){
  const P=G.P, shop=G.screen==='shop', battle=G.screen==='battle';
  show('hud',shop||battle); show('syn',shop); show('shopbar',shop); show('lblFront',shop); show('lblShop',shop);
  show('bnames',battle); show('bbar',battle&&$('banner').classList.contains('hide')); show('title',G.screen==='title');
  if(shop){
    setHud(P);
    const s=synergies(P.team), keys=Object.keys(s).sort((a,b)=>s[b].n-s[a].n);
    $('syn').innerHTML=keys.length?keys.map(k=>`<div class="syn-row ${s[k].lvl?'on':''}" data-f="${k}" style="--c:${FACTIONS[k].color}"><span>${FACTIONS[k].name}</span><span class="n">${s[k].n}/${s[k].n>=2?4:2}</span></div>`).join('')
      :'<div class="syn-hint">Field 2 or 4 units of the same army to unlock its bonus.</div>';
    $('lblFront').style.left=`calc(var(--u)*${teamX(0)})`; $('lblFront').style.top=`calc(var(--u)*${TEAM_Y+11})`;
    $('lblShop').textContent=`RECRUITS · TIER ${tierForTurn(P.turn)} · ${COST} GOLD EACH`;
    $('btnRoll').disabled=P.gold<1;
    const e=entityAt(G.sel); let ctx='';
    if(e&&G.sel.type==='team') ctx=`<button class="btn red" id="btnSell">Sell +${lvlOf(e)}</button>`;
    else if(e) ctx=`<button class="btn ice" id="btnFreeze">${e.frozen?'Unfreeze':'Freeze'}</button>`;
    $('ctx').innerHTML=ctx;
    const d=G.drag&&G.drag.moved&&G.drag.src.type==='team'?entityAt(G.drag.src):null;
    show('sellzone',!!d); if(d) $('sellzone').textContent=`SELL +${lvlOf(d)} GOLD`;
  } else show('sellzone',false);
  refreshInfo();
}
function flushFx(){
  const P=G.P;
  for(const f of P.fx.splice(0)){
    const i=f.uid?P.team.findIndex(u=>u&&u.uid===f.uid):-1, x=i>=0?teamX(i):0;
    if(f.k==='gold') floater(22,20,`+${f.n}${f.label?' '+f.label:''}`,'gold');
    else if(i<0) continue;
    else if(f.k==='buff') floater(x,TEAM_Y-24,delta(f.da,f.dh),'buff');
    else if(f.k==='text') floater(x,TEAM_Y-24,f.text,'buff');
    else if(f.k==='level'){ floater(x,TEAM_Y-32,'LEVEL UP!','gold'); sfx('level'); }
  }
}
function deny(msg){ floater(W/2,108,msg,'err'); sfx('error'); }
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify({P:G.P,UID})); }catch(e){} }
function loadSave(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); return s&&s.P&&Array.isArray(s.P.team)?s:null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function act(src,dst){
  const P=G.P; let ok=false; if(G.busy) return;
  if(dst.type==='sell'){ if(src.type==='team'&&sellUnit(P,src.i,G.rng)){ ok=true; sfx('sell'); } }
  else if(src.type==='shop'){
    if(P.gold<COST) deny('Not enough gold');
    else if(!buyUnit(P,src.i,dst.i,G.rng)) deny('Your army is full');
    else{ ok=true; sfx('buy'); }
  }
  else if(src.type==='team'){ if(moveUnit(P,src.i,dst.i,G.rng)){ ok=true; sfx('click'); } }
  else if(src.type==='item'){
    if(P.gold<COST) deny('Not enough gold');
    else if(!useItem(P,src.i,dst.i,G.rng)) deny(P.items[src.i]&&ITEMS[P.items[src.i].item].noTarget?'No units to feed':'Needs a valid unit');
    else{ ok=true; sfx('buy'); }
  }
  G.sel=null; flushFx(); if(ok) save(); refreshUI();
}
function pickEntity(x,y){
  const P=G.P;
  for(let i=0;i<5;i++) if(Math.abs(x-teamX(i))<=14&&y>=TEAM_Y-28&&y<=TEAM_Y+12) return {type:'team',i};
  for(let j=0;j<P.shop.length;j++) if(Math.abs(x-shopX(j))<=14&&y>=SHOP_Y-26&&y<=SHOP_Y+12) return {type:'shop',i:j};
  for(let k=0;k<P.items.length;k++) if(Math.abs(x-itemX(k))<=14&&y>=SHOP_Y-26&&y<=SHOP_Y+12) return {type:'item',i:k};
  return null;
}
const toV=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
cv.addEventListener('pointerdown',e=>{
  if(G.screen!=='shop'||G.busy) return;
  const p=toV(e), h=pickEntity(p.x,p.y); G.press=p; G.hover=null;
  if(h&&entityAt(h)){ G.drag={src:h,x:p.x,y:p.y,moved:false}; try{cv.setPointerCapture(e.pointerId)}catch(_){} }
});
cv.addEventListener('pointermove',e=>{
  const p=toV(e);
  if(G.screen==='shop'){
    if(G.drag){ G.drag.x=p.x; G.drag.y=p.y; if(!G.drag.moved&&Math.hypot(p.x-G.press.x,p.y-G.press.y)>3){ G.drag.moved=true; G.sel=null; refreshUI(); } }
    else if(e.pointerType==='mouse'){ const h=pickEntity(p.x,p.y), hv=h&&entityAt(h)?h:null; if(!same(hv,G.hover)&&(hv||G.hover&&G.hover.type!=='faction')){ G.hover=hv; refreshInfo(); } }
  } else if(G.screen==='battle'){
    let hv=null; for(const L of BV.views) for(const v of L) if(Math.abs(p.x-v.x)<=11&&p.y>=FIELD_Y-22&&p.y<=FIELD_Y+12) hv={type:'bunit',i:v.id};
    if(!same(hv,G.hover)){ G.hover=hv; refreshInfo(); }
  }
});
cv.addEventListener('pointerup',e=>{
  if(G.screen!=='shop'||G.busy){ G.drag=null; return; }
  const p=toV(e), d=G.drag, h=pickEntity(p.x,p.y); G.drag=null;
  if(d&&d.moved){
    if(d.src.type==='team'&&p.y>114) act(d.src,{type:'sell'});
    else if(h&&h.type==='team') act(d.src,h);
    else refreshUI();
    return;
  }
  if(G.sel&&G.sel.type!=='faction'&&h&&h.type==='team'&&!same(G.sel,h)) return act(G.sel,h);
  if(h&&entityAt(h)){ G.sel=same(G.sel,h)?null:h; sfx('click'); } else G.sel=null;
  refreshUI();
});
cv.addEventListener('pointercancel',()=>{ G.drag=null; if(G.screen==='shop') refreshUI(); });
cv.addEventListener('pointerleave',()=>{ if(G.hover&&G.hover.type!=='faction'){ G.hover=null; refreshInfo(); } });

$('syn').addEventListener('pointerover',e=>{ const r=e.target.closest('.syn-row'); if(r){ G.hover={type:'faction',i:r.dataset.f}; refreshInfo(); } });
$('syn').addEventListener('pointerout',()=>{ if(G.hover&&G.hover.type==='faction'){ G.hover=null; refreshInfo(); } });
$('syn').addEventListener('click',e=>{ const r=e.target.closest('.syn-row'); if(r){ const h={type:'faction',i:r.dataset.f}; G.sel=same(G.sel,h)?null:h; refreshUI(); } });
function doRoll(){ if(G.screen!=='shop'||G.busy) return; if(rollShop(G.P,G.rng)){ sfx('roll'); if(G.sel&&G.sel.type!=='team') G.sel=null; G.hover=null; save(); refreshUI(); } else deny('Not enough gold'); }
function doFreeze(){ const e=!G.busy&&G.sel&&G.sel.type!=='team'&&entityAt(G.sel); if(e){ e.frozen=!e.frozen; sfx('freeze'); save(); refreshUI(); } }
function doSell(){ if(G.sel&&G.sel.type==='team'&&entityAt(G.sel)) act(G.sel,{type:'sell'}); }
$('btnRoll').onclick=doRoll;
$('ctx').addEventListener('click',e=>{ if(e.target.id==='btnSell') doSell(); else if(e.target.id==='btnFreeze') doFreeze(); });
$('btnEnd').onclick=()=>endTurnFlow();
addEventListener('keydown',e=>{ if(G.screen!=='shop'||e.metaKey||e.ctrlKey||!$('modal').classList.contains('hide')) return; const k=e.key.toLowerCase(); if(k==='r') doRoll(); else if(k==='f') doFreeze(); else if(k==='s') doSell(); });

// ---------- flow ----------
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function enterShop(){
  G.screen='shop'; G.sel=G.hover=G.drag=null; G.busy=false; T.token++; show('banner',false); $('fl').innerHTML='';
  refreshUI(); flushFx();
  const P=G.P; if(P.turn>1&&tierForTurn(P.turn)>tierForTurn(P.turn-1)){ floater(W/2,60,`TIER ${tierForTurn(P.turn)} UNLOCKED`,'big'); sfx('level'); }
}
function newGame(){ UID=1; G.P=newPlayer(); startTurn(G.P,G.rng); save(); enterShop(); }
async function endTurnFlow(){
  const P=G.P; if(G.busy||G.screen!=='shop') return;
  if(!P.team.some(Boolean)) return deny('Recruit at least one unit first');
  G.busy=true; G.sel=G.hover=G.drag=null;
  endTurn(P,G.rng); const had=P.fx.length; flushFx(); refreshUI(); sfx('end'); await sleep(had?850:200);
  const opp=makeOpponent(P.turn,G.rng), sim=simulateBattle(P.team,opp.team,(G.rng()*2147483647)|0);
  const before={gold:P.gold,lives:P.lives,wins:P.wins,turn:P.turn}, mine=P.team.slice();
  if(sim.result==='win') P.wins++; else if(sim.result==='lose') P.lives--;
  const over=P.wins>=WINS?'victory':P.lives<=0?'defeat':null;
  // the outcome is applied (and saved) before the replay starts, so a reload can't re-roll a battle
  if(over) clearSave(); else{ P.turn++; startTurn(P,G.rng); save(); }
  G.after={over,result:sim.result,turn:before.turn}; G.opp=opp;
  G.screen='battle'; T.clock=0; T.timers=[]; T.tweens=[]; T.skip=false; setSpeed(T.speed); $('fl').innerHTML='';
  setHud(before); $('oppName').textContent=opp.name; $('chipsL').innerHTML=chips(mine); $('chipsR').innerHTML=chips(opp.team);
  show('banner',false); refreshUI(); G.busy=false;
  playBattle(sim);
}
function showBanner(){
  const a=G.after, P=G.P, r=a.result; T.skip=false;
  $('banner').className=r; $('bannerT').textContent=r==='win'?'VICTORY':r==='lose'?'DEFEAT':'DRAW';
  $('bannerP').textContent=r==='win'?`${P.wins} of ${WINS} wins`:r==='lose'?`${P.lives} ${P.lives===1?'life':'lives'} left`:'Nobody left standing';
  setHud({gold:'–',lives:P.lives,wins:P.wins,turn:a.turn}); show('bbar',false); sfx(r);
  $('btnCont').focus({preventScroll:true});
}
$('btnCont').onclick=()=>{
  const a=G.after; show('banner',false);
  if(!a.over) return enterShop();
  const P=G.P, win=a.over==='victory';
  modal(`<h2 style="color:${win?'#e8c170':'#cf573c'}">${win?'CONQUEROR!':'YOUR ARMY HAS FALLEN'}</h2><p>${win?`Ten victories in ${a.turn} turns, with ${P.lives} ${P.lives===1?'life':'lives'} to spare. History is yours.`:`You held out for ${a.turn} turns and won ${P.wins} ${P.wins===1?'battle':'battles'}.`}</p><button class="btn gold" id="btnAgain">New Game</button>`);
  $('btnAgain').onclick=()=>{ closeModal(); newGame(); };
};
function setSpeed(s){ T.speed=s; document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('on',+b.dataset.speed===s)); }
$('bbar').addEventListener('click',e=>{ const b=e.target.closest('[data-speed]'); if(b) setSpeed(+b.dataset.speed); });
$('btnSkip').onclick=()=>{ T.skip=true; $('fl').innerHTML=''; flushClock(); };

function modal(html){ $('modalBox').innerHTML=html; show('modal',true); }
function closeModal(){ show('modal',false); }
function help(){
  modal(`<h2>How to Play</h2><ul>
<li><b>Recruit.</b> You get 10 gold a turn. Units and supplies cost ${COST}; a new line-up of recruits costs 1.</li>
<li><b>Arrange.</b> Drag units to reorder them. The <b>front</b> of your line is on the right and fights first.</li>
<li><b>Merge.</b> Drop a unit on its twin to combine them. Three copies make level 2, six make level 3, and abilities grow with each level.</li>
<li><b>Armies.</b> Field 2 or 4 units from the same army to switch on its bonus. Mercenaries count for every army you field.</li>
<li><b>Fight.</b> End the turn and your army battles a rival on its own. Win ${WINS} battles before you lose ${LIVES} lives.</li>
<li><b>Tips.</b> Freeze a recruit to keep it for next turn. Drag a unit down to the shop to sell it. Keys: R roll, F freeze, S sell.</li></ul>
<button class="btn gold" id="btnOk">Got it</button>`);
  $('btnOk').onclick=closeModal; $('btnOk').focus({preventScroll:true});
}
$('modal').addEventListener('click',e=>{ if(e.target===$('modal')&&$('btnOk')) closeModal(); });
$('btnHelp').onclick=$('btnHow').onclick=help;
$('btnMute').onclick=()=>{ G.muted=!G.muted; $('btnMute').classList.toggle('on',G.muted); $('btnMute').textContent=G.muted?'×':'♪'; };
$('btnNew').onclick=()=>{ sfx('buy'); newGame(); };
$('btnLoad').onclick=()=>{ const s=loadSave(); if(!s) return newGame(); G.P=s.P; G.P.fx=[]; UID=s.UID||1000; sfx('buy'); enterShop(); };

function fit(){ const s=Math.min(innerWidth/W,innerHeight/H); document.documentElement.style.setProperty('--u',(s>=2?Math.floor(s):s)+'px'); }
addEventListener('resize',fit);

async function boot(){
  fit(); buildIcons(); paintScenes(); await loadSprites();
  const ico=mkCanvas(64,64), ix=ico.getContext('2d'); ix.imageSmoothingEnabled=false; ix.drawImage(SPR.knight.n,1,1,16,16,0,0,64,64);
  const link=document.createElement('link'); link.rel='icon'; link.href=ico.toDataURL(); document.head.appendChild(link);
  show('btnLoad',!!loadSave());
  G.screen='title'; refreshUI(); requestAnimationFrame(frame);
  // #demo=shop:7 or #demo=battle:7 jumps straight into a bot-drafted run (handy for screenshots)
  const m=/demo=(shop|battle):(\d+)/.exec(location.hash);
  if(m){ const P=G.P=newPlayer(); for(let t=1;t<=+m[2];t++){ P.turn=t; startTurn(P,G.rng); if(t<+m[2]){ botShop(P,G.rng,'viking'); endTurn(P,G.rng); } P.fx.length=0; } G.muted=true; enterShop(); if(m[1]==='battle'){ botShop(P,G.rng,'viking'); endTurnFlow(); } }
}
boot();
</script>
