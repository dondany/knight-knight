#hudr{right:calc(var(--u)*4);top:calc(var(--u)*2);display:flex;gap:calc(var(--u)*2)}

.btn{font:inherit;font-size:calc(var(--u)*7.5);line-height:1;color:#ebede9;background:#3c5e8b;border:0;padding:calc(var(--u)*2.5) calc(var(--u)*4) calc(var(--u)*3);cursor:pointer;pointer-events:auto;transition:transform .08s,filter .08s;
  box-shadow:inset 0 calc(var(--u)*1) 0 #4f8fba,inset 0 calc(var(--u)*-1) 0 #253a5e,0 0 0 calc(var(--u)*1) #090a14,0 calc(var(--u)*2) 0 calc(var(--u)*1) rgba(9,10,20,.5);text-shadow:0 calc(var(--u)*.75) 0 #172038;white-space:nowrap}

.btn.pulse{animation:pulse .9s infinite}
.btn img{width:calc(var(--u)*6);height:calc(var(--u)*6);image-rendering:pixelated;vertical-align:calc(var(--u)*-1);margin-left:calc(var(--u)*1)}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}

#syn{left:calc(var(--u)*4);top:calc(var(--u)*17);width:calc(var(--u)*68)}
.syn-row{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1) calc(var(--u)*2);margin-bottom:calc(var(--u)*1);background:rgba(9,10,20,.78);border-left:calc(var(--u)*1.5) solid var(--c);font-size:max(10px,calc(var(--u)*5.6));line-height:1.1;color:#819796;cursor:help;pointer-events:auto;transition:transform .1s}

.fl.gold{color:#e8c170}
.fl.spend{color:#cf573c}

.fl.syn{color:var(--c,#73bed3);font-size:calc(var(--u)*8)}
.fl.block{color:#73bed3}
.fl.ice{color:#a4dddb}

#splash{left:50%;top:calc(var(--u)*78);transform:translate(-50%,-50%);text-align:center;white-space:nowrap;line-height:.9}

#banner{inset:0;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--u)*34);gap:calc(var(--u)*3);background:linear-gradient(rgba(9,10,20,.7),rgba(9,10,20,.2) 55%,rgba(9,10,20,.5));pointer-events:auto}
#btnCont{position:absolute;left:50%;top:calc(var(--u)*158);margin-left:calc(var(--u)*-34);width:calc(var(--u)*68);animation:popin .4s .5s cubic-bezier(.2,1.6,.4,1) both}
#banner h2{margin:0;font-weight:400;font-size:calc(var(--u)*36);line-height:1;text-shadow:0 calc(var(--u)*2) 0 #090a14;animation:slamh .45s cubic-bezier(.2,1.5,.4,1) both}
#banner p{margin:0;font-size:calc(var(--u)*8);color:#c7cfcc;animation:popin .4s .25s both}

@keyframes slamh{0%{transform:scale(5) rotate(-8deg);opacity:0}60%{transform:scale(.9) rotate(1deg);opacity:1}100%{transform:scale(1)}}

#title{inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
#title h1{margin:calc(var(--u)*20) 0 0;font-weight:400;font-size:calc(var(--u)*50);line-height:.9;letter-spacing:calc(var(--u)*1);color:#e8c170;text-shadow:0 calc(var(--u)*2) 0 #be772b,0 calc(var(--u)*4) 0 #602c2c,0 calc(var(--u)*6) 0 #090a14;white-space:nowrap}
#title h1 span{display:inline-block;animation:letter .7s cubic-bezier(.2,1.6,.4,1) both,bobl 2.6s ease-in-out infinite}
@keyframes letter{from{transform:translateY(calc(var(--u)*-90)) rotate(-20deg)}to{transform:none}}
@keyframes bobl{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-2))}}
#title p{margin:calc(var(--u)*9) 0 calc(var(--u)*7);font-size:calc(var(--u)*8);color:#a8b5b2;text-shadow:0 calc(var(--u)*1) 0 #090a14;animation:popin .5s 1s both}
#title .row{display:flex;gap:calc(var(--u)*4)}

#maphead{left:calc(var(--u)*5);top:calc(var(--u)*3);font-size:calc(var(--u)*10);line-height:1}
#maphead small{display:block;font-size:.6em;color:#e8c170;margin-top:calc(var(--u)*1)}
.maplbl{position:absolute;transform:translate(-50%,0);font-size:max(9px,calc(var(--u)*5.2));line-height:1;white-space:nowrap}
.maplbl.lock{color:#a8b5b2}

#crests{left:calc(var(--u)*5);top:calc(var(--u)*163);display:flex;gap:calc(var(--u)*1.5);align-items:center;font-size:max(9px,calc(var(--u)*5.2));background:rgba(9,10,20,.85);padding:calc(var(--u)*2) calc(var(--u)*3);text-shadow:none}
#crests span{margin-right:calc(var(--u)*1)}
#crests i{display:block;width:calc(var(--u)*7);height:calc(var(--u)*8);background:var(--c);clip-path:polygon(0 0,100% 0,100% 75%,50% 100%,0 75%)}
#crests i.off{background:#394a50}

#mapcard{right:calc(var(--u)*5);bottom:calc(var(--u)*6);width:calc(var(--u)*116);pointer-events:auto}
.card{background:rgba(9,10,20,.92);box-shadow:0 0 0 calc(var(--u)*1) #394a50;padding:calc(var(--u)*3);font-size:max(10px,calc(var(--u)*5.4));line-height:1.15}
.card.in{animation:cardin .25s cubic-bezier(.2,1.4,.4,1)}

.card .meta b{color:#cf573c}

.card .btn{margin-top:calc(var(--u)*1)}

.pips i.on{background:#cf573c}
.unlock{display:flex;justify-content:center;gap:calc(var(--u)*3);margin:calc(var(--u)*2) 0 calc(var(--u)*4)}
.unlock img{width:calc(var(--u)*28);height:calc(var(--u)*28);animation:popin .45s cubic-bezier(.2,1.8,.4,1) both}

#modal{inset:0;display:flex;align-items:center;justify-content:center;background:rgba(9,10,20,.75);pointer-events:auto}
#modal .box{max-width:calc(var(--u)*230);max-height:92%;overflow:auto;background:#151d28;box-shadow:0 0 0 calc(var(--u)*1) #577277,0 0 0 calc(var(--u)*2) #090a14;padding:calc(var(--u)*6);font-size:max(11px,calc(var(--u)*6.2));line-height:1.15;text-align:center;animation:popin .28s cubic-bezier(.2,1.5,.4,1)}
#modal h2{margin:0 0 calc(var(--u)*4);font-weight:400;font-size:calc(var(--u)*16);line-height:1;color:#e8c170}

<body>
<div id="stage">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="ui">
    <div id="hud" class="hide ol">
      <span class="stat" title="Gold"><img class="ic" data-ic="coin" alt="Gold"><span id="hGold">10</span></span>
      <span class="stat" title="Lives"><img class="ic" data-ic="heart" alt="Lives"><span id="hLives">5</span></span>
      <span class="stat" title="Wins"><img class="ic" data-ic="trophy" alt="Wins"><span id="hWins">0</span><small id="hGoal">/10</small></span>
      <span class="stat"><small>TURN</small><span id="hTurn">1</span></span>
      <span id="hTag"></span>
    </div>
    <div id="hudr">
      <button class="btn sm hide" id="btnHome" aria-label="Leave">⌂</button>
      <button class="btn sm" id="btnBook" aria-label="Collection"><img data-ic="list" alt=""></button>
      <button class="btn sm" id="btnHelp" aria-label="How to play">?</button>
      <button class="btn sm" id="btnMute" aria-label="Toggle sound">♪</button>
    </div>
    <div id="syn" class="hide"></div>
    <div id="info" class="hide"></div>
    <div id="lblFront" class="lbl hide">FRONT</div>
    <div id="lblShop" class="lbl hide"></div>
    <div id="hand" class="hide"></div>
    <div id="sellzone" class="hide"></div>
    <div id="shopbar" class="hide">

<script>
'use strict';
//#region LOGIC ============================================================
// Pure game rules: no DOM in this region (it is also run headless for balance sims).
const CAP = 50, COST = 3, LIVES = 5, WINS = 10;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeRng(seed){
  const f = mulberry32(seed);
  f.int = n => Math.floor(f()*n);
  f.pick = a => a[f.int(a.length)];
  f.shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=f.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
  return f;
}

const FACTIONS = {
  medieval:{name:'Medieval', color:'#4f8fba', syn:'Tithe',      tiers:['+1 gold at the start of every turn.','+3 gold at the start of every turn.']},
  viking:  {name:'Vikings',  color:'#75a743', syn:'Blood Rage', tiers:['When a Viking faints, the other Vikings gain +1/+1.','When a Viking faints, the other Vikings gain +2/+2.']},
  spartan: {name:'Spartans', color:'#cf573c', syn:'Phalanx',    tiers:['Spartans take 1 less damage (min 1).','Spartans take 2 less damage (min 1).']},
  egypt:   {name:'Egyptians',color:'#e8c170', syn:'Afterlife',  tiers:['The first Egyptian to faint rises as a Mummy with half its stats.','Every Egyptian rises once as a Mummy with half its stats.']},
  roman:   {name:'Romans',   color:'#c65197', syn:'Drill',      tiers:['End of turn: a random Roman gains +1 health for good.','End of turn: every Roman gains +1 health for good.']},
  japan:   {name:'Japanese', color:'#df84a5', syn:'Bushido',    tiers:['Each Japanese unit deals +2 damage with its first attack.','Each Japanese unit deals +5 damage with its first attack.']},
  gaul:    {name:'Gauls',    color:'#a8b5b2', syn:'Furor',      tiers:['After a Gaul attacks, it gains +2/+2.','After a Gaul attacks, it gains +4/+4.']},
};
// An army can be flagged `wild:true` instead of having a bonus of its own (see synergies()). None is
// today: the Gauls were wild until they got Furor, and the rule is kept for an army still to come.
// REAL_F is the armies with a bonus; ARMIES is all of them.
const ARMIES = Object.keys(FACTIONS), REAL_F = ARMIES.filter(f=>!FACTIONS[f].wild);

const UNITS = {};
function def(key,name,faction,tier,atk,hp,col,row,pos,ability,text,extra){
  UNITS[key] = Object.assign({key,name,faction,tier,atk,hp,sx:col*16,sy:row*16,pos,ability,text}, extra);
}
const MUMMY = {name:'Mummy', faction:'egypt', tier:0, ability:'Risen', text:'A hollow husk. No ability.'};

let UID = 1;
function lvlOf(u){return u.xp>=5?3:u.xp>=2?2:1}
function mkUnit(key){const d=UNITS[key];return{uid:UID++,key,atk:d.atk,hp:d.hp,xp:0,gear:null}}
function pbuff(P,u,da,dh){u.atk=Math.min(CAP,u.atk+da);u.hp=Math.min(CAP,u.hp+dh);P.fx.push({k:'buff',uid:u.uid,da,dh})}

  {on:{start(u,B){const n=B.allies(u).filter(x=>x!==u&&B.isF(x,'roman')).length;if(!n)return;B.say(u);B.buff(u,n*u.lvl,n*u.lvl)}}});

def('carnyx','Carnyx Player','gaul',1,1,2, 4,6, 2,'Rally','End of turn: give the friend ahead {+1|+2|+3} health for good.',
  {shop:{endTurn(u,P,rng,slot){for(let i=slot-1;i>=0;i--)if(P.team[i]){pbuff(P,P.team[i],0,lvlOf(u));break}}}});
def('druid','Druid','gaul',2,2,3, 1,6, 2,'Omen','Start of battle: deal {3|6|9} damage to the enemy with the highest attack.',
  {on:{start(u,B){const f=B.foes(u);if(!f.length)return;B.say(u);B.shoot(u,[f.reduce((a,b)=>b.atk>a.atk?b:a)],3*u.lvl)}}});
def('ambactus','Ambactus','gaul',3,3,5, 2,6, 1,'Paid in Gold','End of turn: if you have 2+ unspent gold, gain {+1/+1|+2/+2|+3/+3} for good.',
  {shop:{endTurn(u,P){if(P.gold>=2){const l=lvlOf(u);pbuff(P,u,l,l)}}}});
def('gaesatus','Gaesatus','gaul',4,5,5, 0,6, 0,'Frenzy','After attack: gain {+2|+4|+6} attack.',
  {on:{afterAttack(u,B){B.say(u);B.buff(u,2*u.lvl,0)}}});
def('chieftain','Chieftain','gaul',5,4,5, 3,6, 0,'Confederation','Start of battle: gain {+1/+1|+2/+2|+3/+3} for each other Gaul and each other army on your team.',
  {on:{start(u,B){const o=B.allies(u).filter(x=>x!==u),n=o.filter(x=>x.def.faction==='gaul').length+new Set(o.map(x=>x.def.faction).filter(f=>f!=='gaul')).size;if(!n)return;B.say(u);B.buff(u,n*u.lvl,n*u.lvl)}}});

const UNIT_KEYS = Object.keys(UNITS);

// `short` is the few words that fit on the item's shop card; `text` is the full rule.
const ITEMS = {
  ration:   {name:'Ration',      tier:1, short:'+1/+1', text:'Give a unit +1/+1.'},
  whetstone:{name:'Whetstone',   tier:2, gear:true, short:'+3 damage', text:'Gear: attacks deal +3 damage.'},
  chainmail:{name:'Chainmail',   tier:3, gear:true, short:'Take 2 less', text:'Gear: take 2 less damage (min 1).'},
  feast:    {name:'Feast',       tier:4, noTarget:true, short:'3 units +1/+1', text:'Give 3 random units +1/+1.'},
  manual:   {name:'War Manual',  tier:4, short:'+1 XP', text:'Give a unit +1 experience.'},
  shield:   {name:'Tower Shield',tier:5, gear:true, short:'Block 1 hit', text:'Gear: block the first hit each battle.'},
  ankh:     {name:'Ankh',        tier:6, gear:true, short:'Revive as 1/1', text:'Gear: once per battle, return from death as a 1/1.'},
};
const ITEM_KEYS = Object.keys(ITEMS);

// Units of a wild army each add +1 to every army that already has 2 real members (`w` = wilds counted)
// and share those armies' bonuses. They push a bonus to its next tier but cannot switch one on alone.
const isWild = f => !!FACTIONS[f].wild;
function synergies(units){
  const real={}; let wild=0;
  for(const u of units){ if(!u) continue; const f=UNITS[u.key].faction; if(isWild(f)) wild++; else real[f]=(real[f]||0)+1; }
  const out={};
  for(const f in real){ const w=real[f]>=2?wild:0, n=real[f]+w; out[f]={n, w, lvl:n>=4?2:n>=2?1:0}; }
  return out;
}

// ---------- shop phase ----------
// A run is a player state P. Skirmish uses the defaults; story expeditions pass a restricted
// recruit pool, `fast` tiers (one per turn instead of one per two turns), fewer lives and a win goal.
const tierOf = P => Math.min(6, P.fast ? P.turn : Math.floor((P.turn+1)/2));
const shopSize = T => T>=5?5:T>=3?4:3;
const itemSlots = T => T>=3?2:1;
function newPlayer(o){ o=o||{}; return {gold:10,turn:1,lives:o.lives||LIVES,goal:o.goal||WINS,wins:0,team:[null,null,null,null,null],shop:[],items:[],fx:[],pool:o.pool||null,fast:!!o.fast,bonus:o.bonus||0,story:o.story||null,cap:o.cap||5}; }
function canMerge(a,b){return a&&b&&a!==b&&a.key===b.key&&lvlOf(a)<3}

function refill(P,rng){
  const T=tierOf(P), all=P.pool||UNIT_KEYS, ipool=ITEM_KEYS.filter(k=>ITEMS[k].tier<=T);
  let pool=all.filter(k=>UNITS[k].tier<=T); if(!pool.length) pool=all;
  P.shop=P.shop.filter(s=>s.frozen); while(P.shop.length<shopSize(T)) P.shop.push({u:mkUnit(rng.pick(pool)),frozen:false});
  P.items=P.items.filter(s=>s.frozen); while(P.items.length<itemSlots(T)) P.items.push({item:rng.pick(ipool),frozen:false,id:UID++});
}
function startTurn(P,rng){
  const s=synergies(P.team).medieval, tithe=[0,1,3][s?s.lvl:0], tribute=P.turn===1?P.bonus||0:0;
  P.gold=10+tithe+tribute;
  if(tithe) P.fx.push({k:'gold',n:tithe,label:'Tithe'});
  if(tribute) P.fx.push({k:'gold',n:tribute,label:'Tribute'});
  refill(P,rng);
}
function rollShop(P,rng){ if(P.gold<1) return false; P.gold--; refill(P,rng); return true; }
function levelUp(P,t,rng){
  P.fx.push({k:'level',uid:t.uid});
  if(P.shop.length<6){
    // bonus recruit from the next tier up (or the best the pool has, when an army skips that tier)
    const T=Math.min(6,tierOf(P)+1), all=(P.pool||UNIT_KEYS).filter(k=>UNITS[k].tier<=T), top=Math.max(...all.map(k=>UNITS[k].tier));
    P.shop.push({u:mkUnit(rng.pick(all.filter(k=>UNITS[k].tier===top))),frozen:false,bonus:true});
  }
}
function mergeInto(P,t,inc,rng){
  const before=lvlOf(t);
  t.atk=Math.min(CAP,Math.max(t.atk,inc.atk)+1); t.hp=Math.min(CAP,Math.max(t.hp,inc.hp)+1);
  t.xp=Math.min(5,t.xp+inc.xp+1); if(!t.gear) t.gear=inc.gear;
  if(lvlOf(t)>before) levelUp(P,t,rng);
}
// free up `slot` by sliding its neighbours toward the nearest gap
function makeRoom(P,slot){
  const t=P.team; if(!t[slot]) return true;
  let gap=-1; for(let i=0;i<5;i++) if(!t[i]&&(gap<0||Math.abs(i-slot)<Math.abs(gap-slot))) gap=i;
  if(gap<0) return false;
  if(gap>slot) for(let i=gap;i>slot;i--) t[i]=t[i-1]; else for(let i=gap;i<slot;i++) t[i]=t[i+1];
  t[slot]=null; return true;
}
function canBuyInto(P,u,slot){ return canMerge(P.team[slot],u) || P.team.includes(null); }
function buyUnit(P,si,slot,rng){
  const s=P.shop[si]; if(!s||P.gold<COST) return null;
  const u=s.u, t=P.team[slot]; let res;
  if(canMerge(t,u)){ P.gold-=COST; P.shop.splice(si,1); mergeInto(P,t,u,rng); res=t; }
  else{ if(!makeRoom(P,slot)) return null; P.gold-=COST; P.shop.splice(si,1); P.team[slot]=u; res=u; }
  const h=UNITS[res.key].shop; if(h&&h.buy) h.buy(res,P,rng);
  return res;
}
function sellUnit(P,slot,rng){
  const u=P.team[slot]; if(!u) return false;
  P.team[slot]=null; const n=lvlOf(u); P.gold+=n; P.fx.push({k:'gold',n});
  const h=UNITS[u.key].shop; if(h&&h.sell) h.sell(u,P,rng);
  return true;
}
function moveUnit(P,a,b,rng){
  if(a===b) return false; const ua=P.team[a], ub=P.team[b]; if(!ua) return false;
  if(canMerge(ub,ua)){ mergeInto(P,ub,ua,rng); P.team[a]=null; } else { P.team[a]=ub; P.team[b]=ua; }
  return true;
}
function canUseItem(P,key,slot){
  const u=P.team[slot];
  if(ITEMS[key].noTarget) return P.team.some(Boolean);
  if(!u) return false;
  return !(key==='manual'&&lvlOf(u)>=3);
}
function useItem(P,ii,slot,rng){
  const s=P.items[ii]; if(!s||P.gold<COST||!canUseItem(P,s.item,slot)) return false;
  const u=P.team[slot], it=ITEMS[s.item];
  if(it.gear){ u.gear=s.item; P.fx.push({k:'text',uid:u.uid,text:it.name}); }
  else if(s.item==='ration') pbuff(P,u,1,1);
  else if(s.item==='feast') rng.shuffle(P.team.filter(Boolean)).slice(0,3).forEach(x=>pbuff(P,x,1,1));
  else if(s.item==='manual'){ const b=lvlOf(u); u.xp++; P.fx.push({k:'text',uid:u.uid,text:'+1 XP'}); if(lvlOf(u)>b) levelUp(P,u,rng); }
  P.gold-=COST; P.items.splice(ii,1); return true;
}
function endTurn(P,rng){
  P.team.forEach((u,i)=>{ if(!u) return; const h=UNITS[u.key].shop; if(h&&h.endTurn) h.endTurn(u,P,rng,i); });
  const s=synergies(P.team).roman;
  if(s&&s.lvl){
    const rs=P.team.filter(u=>{ const f=u&&UNITS[u.key].faction; return f==='roman'||(f&&isWild(f)); });
    (s.lvl>1?rs:[rng.pick(rs)]).forEach(u=>pbuff(P,u,0,1));
  }

// ---------- battle ----------
// Returns a flat event log; the view replays it. `q` on an event means "don't pause after this one".
function simulateBattle(TA,TB,seed){
  const rng=makeRng(seed), ev=[], sides=[[],[]], meta=[], dying=[]; let nid=0;
  [TA,TB].forEach((t,s)=>{
    const us=t.filter(Boolean), syn=synergies(us);
    sides[s]=us.map(u=>{const d=UNITS[u.key],l=lvlOf(u);return{id:++nid,key:u.key,def:d,side:s,atk:u.atk,hp:u.hp,hp0:u.hp,lvl:l,gear:u.gear||null,boss:!!u.boss,block:(d.blocks?l:0)+(u.gear==='shield'?1:0),dead:false,tb:rng()}});
    meta[s]={syn,afterlife:syn.egypt?[0,1,9][syn.egypt.lvl]:0,furor:0};
  });
  const snap=u=>({id:u.id,key:u.key,side:u.side,atk:u.atk,hp:u.hp,lvl:u.lvl,gear:u.gear,block:u.block,mummy:!!u.mummy,boss:!!u.boss});
  const alive=L=>L.filter(u=>!u.dead);
  // synergy level `u` enjoys for faction f (0 if none)
  const sl=(u,f)=>{const s=meta[u.side].syn[f];if(!s||u.mummy)return 0;const uf=u.def.faction;return(uf===f||isWild(uf))?s.lvl:0};
  const trig=(u,n,a,b)=>{const f=u.def.on&&u.def.on[n];if(f)f(u,B,a,b)};

  function hit(t,amt,src,q){
    if(!t||t.dead) return;
    if(t.block>0){ t.block--; ev.push({t:'block',id:t.id,block:t.block,q:!!q}); return; }
    const red=(t.def.armor?t.lvl:0)+sl(t,'spartan')+(t.gear==='chainmail'?2:0);
    amt=Math.max(1,amt-red); t.hp-=amt;
    ev.push({t:'dmg',id:t.id,amt,hp:Math.max(0,t.hp),q:!!q});
    if(t.hp<=0){ t.dead=true; dying.push(t); } else trig(t,'hurt');
  }
  function summon(side,i,spec){
    const L=sides[side]; if(alive(L).length>=5) return null;
    const d=UNITS[spec.key], l=spec.lvl||1;
    const u={id:++nid,key:spec.key,def:spec.mummy?MUMMY:d,side,atk:spec.atk,hp:spec.hp,hp0:spec.hp,lvl:l,gear:null,block:(!spec.mummy&&d.blocks?l:0),dead:false,risen:true,mummy:!!spec.mummy,tb:0};
    i=Math.min(i,L.length); L.splice(i,0,u); ev.push({t:'summon',side,index:i,unit:snap(u)}); return u;
  }
  const B={rng,
    foes:u=>alive(sides[1-u.side]), allies:u=>alive(sides[u.side]), isF:(u,f)=>!u.mummy&&(u.def.faction===f||(isWild(u.def.faction)&&!!(meta[u.side].syn[f]&&meta[u.side].syn[f].w))),
    say(u){ev.push({t:'ability',id:u.id,name:u.def.ability})},
    buff(u,da,dh,q){ if(u.dead) return; const a0=u.atk,h0=u.hp; u.atk=Math.max(1,Math.min(CAP,u.atk+da)); u.hp=Math.min(CAP,u.hp+dh); ev.push({t:'buff',id:u.id,da:u.atk-a0,dh:u.hp-h0,atk:u.atk,hp:u.hp,q:!!q}); },
    buffAll(us,da,dh){us.forEach((x,i)=>B.buff(x,da,dh,i<us.length-1))},
    hit, summon,
    shoot(src,ts,amt){ ts=ts.filter(Boolean); if(!ts.length) return; ev.push({t:'shot',from:src.id,to:ts.map(x=>x.id)}); ts.forEach((x,i)=>hit(x,amt,src,i<ts.length-1)); },
    ward(u,n){ u.block+=n; ev.push({t:'status',id:u.id,block:u.block}); },
    kick(t){ const L=sides[t.side]; if(alive(L).length<2) return; L.splice(L.indexOf(t),1); L.push(t); ev.push({t:'order',side:t.side,ids:L.map(x=>x.id),kicked:t.id}); },
  };
  function resolve(){
    let guard=0;
    while(dying.length&&guard++<200){
      const u=dying.shift(), L=sides[u.side], i=L.indexOf(u); if(i<0) continue;
      const behind=L[i+1]; L.splice(i,1); ev.push({t:'faint',id:u.id});
      trig(u,'faint',i);
      if(!u.risen){
        if(u.gear==='ankh') summon(u.side,i,{key:u.key,atk:1,hp:1,lvl:u.lvl});
        if(sl(u,'egypt')&&meta[u.side].afterlife>0){ meta[u.side].afterlife--; ev.push({t:'syn',side:u.side,f:'egypt'}); summon(u.side,i,{key:u.key,atk:Math.ceil(u.atk/2),hp:Math.ceil(u.hp0/2),mummy:true}); }
        const rage=sl(u,'viking'), vs=rage?alive(L).filter(v=>sl(v,'viking')):[];
        if(vs.length){ ev.push({t:'syn',side:u.side,f:'viking'}); B.buffAll(vs,rage,rage); }
      }
      if(behind&&!behind.dead) trig(behind,'friendAheadFaints',u);
      for(const f of alive(L)) trig(f,'friendFaints',u,i);
    }
  }
  const strike=u=>{ let d=u.atk+(u.gear==='whetstone'?3:0)+(u.def.iaido?(u.lvl-1)*3:0); if(!u.struck) d+=[0,2,5][sl(u,'japan')]; return d; };

  ev.push({t:'init',units:[...sides[0],...sides[1]].map(snap)});
  [...sides[0],...sides[1]].filter(u=>u.def.on&&u.def.on.start).sort((x,y)=>y.atk-x.atk||x.tb-y.tb)
    .forEach(u=>{ if(!u.dead){ trig(u,'start'); resolve(); } });

  let rounds=0;
  while(sides[0].length&&sides[1].length&&rounds++<300){
    const a=sides[0][0], b=sides[1][0];
    for(const u of [a,b]) if(!u.ready&&!u.dead){ u.ready=true; trig(u,'beforeAttack'); }
    resolve();
    if(sides[0][0]!==a||sides[1][0]!==b) continue;
    ev.push({t:'attack',a:a.id,b:b.id});
    const da=strike(a), db=strike(b); a.struck=b.struck=true; a.ready=b.ready=false;
    const ia=!!a.def.iaido, ib=!!b.def.iaido;
    if(ia&&!ib){ hit(b,da,a); if(!b.dead) hit(a,db,b); }
    else if(ib&&!ia){ hit(a,db,b); if(!a.dead) hit(b,da,a); }
    else { hit(b,da,a,true); hit(a,db,b); }
    for(const s of [sides[0][1],sides[1][1]]) if(s&&!s.dead) trig(s,'friendAheadAttacks');
    for(const u of [a,b]) if(!u.dead) trig(u,'afterAttack');
    // Furor: a Gaul that attacked and is still standing comes out of it bigger (`again` = already called out this battle)
    [a,b].filter(u=>!u.dead&&sl(u,'gaul')).forEach((u,i,us)=>{ const n=2*sl(u,'gaul'); ev.push({t:'syn',side:u.side,f:'gaul',again:meta[u.side].furor++>0}); B.buff(u,n,n,i<us.length-1); });
    if(b.dead&&!a.dead) trig(a,'knockout');
    if(a.dead&&!b.dead) trig(b,'knockout');
    resolve();
  }
  const result=sides[0].length?(sides[1].length?'draw':'win'):(sides[1].length?'lose':'draw');
  ev.push({t:'end',result});
  return {ev,result,rounds};
}

// ---------- opponents: a greedy bot that plays the same shop as you ----------
function unitValue(u,fav){const d=UNITS[u.key];return u.atk+u.hp+d.tier*3+u.xp*2+(d.faction===fav||isWild(d.faction)?4:0)+(u.gear?2:0)}
function arrange(P){
  const us=P.team.filter(Boolean).sort((a,b)=>UNITS[a.key].pos-UNITS[b.key].pos||b.hp-a.hp);
  P.team=[0,1,2,3,4].map(i=>us[i]||null);
}
function botShop(P,rng,fav){
  let guard=0;
  while(guard++<80){
    let best=null; const consider=c=>{if(!best||c.sc>best.sc)best=c};
    if(P.gold>=COST){
      P.shop.forEach((s,i)=>{
        const d=UNITS[s.u.key], base=d.tier*2+(d.faction===fav||isWild(d.faction)?5:0)+rng()*2;
        const dup=P.team.findIndex(x=>canMerge(x,s.u)), empty=P.team.filter(Boolean).length<P.cap?P.team.indexOf(null):-1;
        if(dup>=0) consider({k:'buy',i,slot:dup,sc:base+5});
        else if(empty>=0) consider({k:'buy',i,slot:empty,sc:base+4});
        else{
          let w=-1,wv=1e9; P.team.forEach((x,j)=>{if(!x)return;const v=unitValue(x,fav);if(v<wv){wv=v;w=j}});
          const nv=unitValue(s.u,fav); if(nv>wv+1) consider({k:'swap',i,slot:w,sc:base+(nv-wv)*.5});
        }
      });
      if(P.team.filter(Boolean).length>=3) P.items.forEach((s,i)=>{
        const it=ITEMS[s.item]; let slot=-1,sc=3,bv=-1;
        if(it.gear){ P.team.forEach((x,j)=>{if(x&&!x.gear&&x.atk+x.hp>bv){bv=x.atk+x.hp;slot=j}}); sc=5+it.tier; }
        else if(s.item==='manual'){ P.team.forEach((x,j)=>{if(x&&lvlOf(x)<3&&x.xp*10+x.atk+x.hp>bv){bv=x.xp*10+x.atk+x.hp;slot=j}}); sc=6; }
        else if(s.item==='feast'){ slot=P.team.findIndex(Boolean); sc=7; }
        else slot=rng.pick(P.team.map((x,j)=>x?j:-1).filter(j=>j>=0));
        if(slot>=0) consider({k:'item',i,slot,sc:sc+rng()});
      });
    }
    if(best){
      if(best.k==='item') useItem(P,best.i,best.slot,rng);
      else{ if(best.k==='swap') sellUnit(P,best.slot,rng); buyUnit(P,best.i,best.slot,rng); }
    } else if(!rollShop(P,rng)) break;
    P.fx.length=0;
  }
  arrange(P);
}
const ARMY_NAMES = {
  medieval:['The Iron Crown','Lionheart Levy','Black Keep','The Round Table'],
  viking:['Sea Wolves','Ravens of Odin','Frost Raiders','Longship Kin'],
  spartan:['The Three Hundred','The Bronze Wall','Sons of Ares','Crimson Phalanx'],
  egypt:['Sons of Ra','The Nile Guard','Scarab Host','Eternal Dynasty'],
  roman:['Legio IX','Eagles of Rome','The Iron Legion','Praetorians'],
  japan:['Crane Clan','Moonlit Blades','Tiger Shogunate','The Forty-Seven'],

};
// foe (optional): {fav, pool, fast, cap (army size), gold (delta per turn), boss:{key,name,bonus}}
function makeOpponent(turn,rng,foe){
  foe=foe||{};
  const fav=foe.fav||rng.pick(REAL_F), P=newPlayer({pool:foe.pool,fast:foe.fast,cap:foe.cap}), waste=foe.gold!=null?-foe.gold:rng.int(3);
  for(let t=1;t<=turn;t++){ P.turn=t; startTurn(P,rng); P.gold=Math.max(3,P.gold-waste); botShop(P,rng,fav); endTurn(P,rng); P.fx.length=0; }
  // name the army after whatever it actually ended up fielding
  const n={}; P.team.forEach(u=>{ if(u){ const f=UNITS[u.key].faction; if(!isWild(f)) n[f]=(n[f]||0)+1; } });
  const army=isWild(fav)?fav:REAL_F.reduce((a,f)=>(n[f]||0)>(n[a]||0)?f:a,fav);
  let name=rng.pick(ARMY_NAMES[army]);
  if(foe.boss){
    // the region's leader joins the last battle: tougher than a recruit, taking the weakest unit's place
    const b=mkUnit(foe.boss.key), us=P.team.filter(Boolean); b.boss=true; b.atk+=foe.boss.bonus; b.hp+=foe.boss.bonus*2;
    if(us.length>=5) us.splice(us.reduce((w,u,i)=>u.atk+u.hp<us[w].atk+us[w].hp?i:w,0),1);
    us.push(b); P.team=us; arrange(P); name=foe.boss.name;
  }
  return {name,fav,army,team:P.team,boss:!!foe.boss};
}

const REGION_KEYS = Object.keys(REGIONS).filter(k=>k!=='home');
const neighbours = id => ROUTES.filter(r=>r[0]===id||r[1]===id).map(r=>r[0]===id?r[1]:r[0]);

function storyRun(S,id){

function storyFoe(P){

}
// shortest walk from where you stand to `to`, passing only through conquered regions
function storyPath(S,to){
  const prev={[S.at]:null}, q=[S.at];
  while(q.length){ const c=q.shift(); if(c===to) break; for(const n of neighbours(c)) if(!(n in prev)&&(n===to||S.conquered.includes(n))){ prev[n]=c; q.push(n); } }
  const out=[]; for(let c=to;c!=null;c=prev[c]) out.unshift(c); return out[0]===S.at?out:[S.at,to];
}

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function buildIcons(){
  for(const k in ART){ const rows=ART[k], c=mkCanvas(rows[0].length,rows.length), x=c.getContext('2d');

}
const MUMMY_RAMP=[[32,46,55],[57,74,80],[87,114,119],[129,151,150],[168,181,178],[208,218,145]];
// Cut each 16x16 unit out of the sheet: key out the background colour, add a 1px dark outline,
// and pre-bake a white (hit flash) and a mummified variant.
function buildSprites(img){
  const c=mkCanvas(img.width,img.height), x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(img,0,0);
  const src=x.getImageData(0,0,c.width,c.height), D=src.data, bg=[D[0],D[1],D[2]];
  const cut=(sx,sy,mode)=>{
    const o=mkCanvas(18,18), og=o.getContext('2d'), im=og.createImageData(18,18);
    const solid=(px,py)=>{ if(px<0||py<0||px>15||py>15) return false; const X=sx+px,Y=sy+py; if(X<0||Y<0||X>=src.width||Y>=src.height) return false;
      const i=(Y*src.width+X)*4; return D[i+3]>127&&!(D[i]===bg[0]&&D[i+1]===bg[1]&&D[i+2]===bg[2]); };
    for(let py=-1;py<17;py++) for(let px=-1;px<17;px++){
      const o4=((py+1)*18+px+1)*4;
      if(solid(px,py)){
        const i=((sy+py)*src.width+sx+px)*4; let col=[D[i],D[i+1],D[i+2]];
        if(mode==='white') col=[255,255,255];
        else if(mode==='mummy'){ const l=col[0]*.3+col[1]*.59+col[2]*.11; col=MUMMY_RAMP[Math.min(5,Math.floor(l/256*6))]; }
        im.data.set([col[0],col[1],col[2],255],o4);
      } else if(solid(px-1,py)||solid(px+1,py)||solid(px,py-1)||solid(px,py+1)) im.data.set(mode==='white'?[255,255,255,255]:[9,10,20,255],o4);
    }
    og.putImageData(im,0,0); return o;
  };
  for(const k in UNITS){ const d=UNITS[k]; SPR[k]={n:cut(d.sx,d.sy),w:cut(d.sx,d.sy,'white'),m:cut(d.sx,d.sy,'mummy')}; }
}
const sprURL=k=>SURL[k]||(SURL[k]=SPR[k].n.toDataURL());
function loadImage(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
// characters.PNG next to this file wins (so the art stays editable); the embedded copy is the
// fallback for file:// where browsers refuse pixel access to local images.
async function loadSprites(){
  try{ buildSprites(await loadImage('characters.PNG')); }
  catch(e){ buildSprites(await loadImage(SPRITE_FALLBACK)); }
}

const DIGITS={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111'};
function digits(s,x,y,col,c=g){ c.fillStyle=col; for(const ch of String(s)){ const m=DIGITS[ch]; if(m) for(let i=0;i<15;i++) if(m[i]==='1') c.fillRect(x+i%3,y+(i/3|0),1,1); x+=4; } }
function badge(x,y,val,bg,right,c=g){ const s=String(val), w=s.length*4+1, bx=right?x-w:x; c.fillStyle='#090a14'; c.fillRect(bx-1,y-1,w+2,9); c.fillStyle=bg; c.fillRect(bx,y,w,7); digits(s,bx+1,y+1,'#ebede9',c); }

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5], BG={field:{}};
function dither(x,cols,y0,y1){ const n=cols.length-1; for(let y=y0;y<y1;y++){ const f=(y-y0)/(y1-y0)*n, i=Math.min(n-1,Math.floor(f)), fr=f-i; for(let px=0;px<W;px++){ x.fillStyle=cols[fr>(BAYER[(y&3)*4+(px&3)]+.5)/16?i+1:i]; x.fillRect(px,y,1,1); } } }
function ridge(x,col,base,amp,r,bottom){ const p=[r()*6,r()*6,r()*6]; x.fillStyle=col; for(let px=0;px<W;px++){ const h=Math.sin(px*.021+p[0])*.5+Math.sin(px*.053+p[1])*.3+Math.sin(px*.13+p[2])*.2; const y=Math.round(base-amp*(h*.5+.5)); x.fillRect(px,y,1,bottom-y); } }
function speckle(x,r,y0,y1,cols,n){ for(let i=0;i<n;i++){ x.fillStyle=r.pick(cols); x.fillRect(r.int(W),y0+r.int(y1-y0),1+r.int(2),1); } }
function disc(x,cx,cy,rad,col){ x.fillStyle=col; for(let dy=-rad;dy<=rad;dy++){ const w=Math.round(Math.sqrt(rad*rad-dy*dy)); x.fillRect(cx-w,cy+dy,w*2,1); } }
// a triangle with a lit left face and a shaded right face (pyramids, peaks, roofs)
function tri(x,cx,base,h,hw,cl,cr){ for(let i=0;i<h;i++){ const w=Math.round(hw*(i+1)/h), y=base-h+i; x.fillStyle=cl; x.fillRect(cx-w,y,w,1); x.fillStyle=cr; x.fillRect(cx,y,w,1); } }

function updateParts(dt){
  for(let i=PT.length-1;i>=0;i--){ const p=PT[i]; p.life-=dt; if(p.life<=0){ PT.splice(i,1); continue; }
    if(p.home&&p.max-p.life>p.home.d){ const dx=p.home.x-p.x, dy=p.home.y-p.y, d=Math.hypot(dx,dy); if(d<5){ p.home.cb(); PT.splice(i,1); continue; } p.vx+=(dx/d*.3-p.vx)*.2; p.vy+=(dy/d*.3-p.vy)*.2; }
    else{ p.vy+=(p.g||0)*dt; if(p.drag){ const k=Math.pow(p.drag,dt/16); p.vx*=k; p.vy*=k; } }
    p.x+=p.vx*dt+(p.wob?Math.sin(p.life*.005+p.ph)*p.wob*dt*.06:0); p.y+=p.vy*dt; }
}
function drawParts(c,layer){
  for(const p of PT){ if((p.layer||0)!==layer||(p.tw&&Math.sin(p.life*.02+p.ph)<-.2)) continue;
    const s=p.size||1, x=Math.round(p.x), y=Math.round(p.y); c.globalAlpha=p.fade?Math.min(1,p.life/p.fade):1;
    if(p.coin){ c.fillStyle='#090a14'; c.fillRect(x-1,y-1,4,4); c.fillStyle='#e8c170'; c.fillRect(x,y,2,2); c.fillStyle='#ebede9'; c.fillRect(x,y,1,1); }
    else{ c.fillStyle=p.col; c.fillRect(x,y,s,s); } }
  c.globalAlpha=1;
  for(let i=FX.length-1;i>=0;i--){ const f=FX[i], p=(G.time-f.t0)/f.ms; if(p>=1){ FX.splice(i,1); continue; } if(f.layer!==layer) continue;
    c.fillStyle=f.col; c.globalAlpha=1-p;
    if(f.k==='ring'){ const rr=f.r1*(1-(1-p)*(1-p)), n=Math.max(10,rr*5|0); for(let k=0;k<n;k++){ const a=k/n*6.283; c.fillRect(Math.round(f.x+Math.cos(a)*rr),Math.round(f.y+Math.sin(a)*rr*.7),1,1); } }
    else if(f.k==='spark'){ const d=2+p*7; for(let k=0;k<8;k++){ const a=k*.785; c.fillRect(Math.round(f.x+Math.cos(a)*d),Math.round(f.y+Math.sin(a)*d),k%2?1:2,k%2?1:2); } }
    else if(f.k==='beam'){ const w=Math.max(1,Math.round(7*(1-p))); c.fillRect(Math.round(f.x-w/2),f.y-46,w,46); }
    else if(f.k==='flash'){ c.globalAlpha=(1-p)*.55; c.fillRect(0,0,W,H); }
    else if(f.k==='star'){ const sx=f.x+p*46, sy=f.y+p*16; for(let k=0;k<6;k++){ c.globalAlpha=(1-k/6)*(1-p); c.fillRect(Math.round(sx-k*2),Math.round(sy-k*.7),1,1); } } }
  c.globalAlpha=1;
}

let AC=null, NB=null;
function tone(f,dur,type,vol,slide,delay){
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), a=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  a.gain.setValueAtTime(vol||.04,t); a.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(a).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol,freq,delay){
  if(!NB){ NB=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t=AC.currentTime+(delay||0), s=AC.createBufferSource(), f=AC.createBiquadFilter(), a=AC.createGain();

function act(src,dst){
  const P=G.P; let ok=false; if(G.busy||G.trans) return;
  // a frozen card that is played leaves its ice behind in the hand
  const card=src.type==='shop'?P.shop[src.i]:src.type==='item'?P.items[src.i]:null, ice=card&&card.frozen&&{x:src.type==='shop'?shopX(src.i):itemX(src.i),y:HAND_Y};
  if(dst.type==='sell'){ const x=teamX(src.i), u=P.team[src.i]; if(src.type==='team'&&sellUnit(P,src.i,G.rng)){ ok=true; sfx('sell'); ring(x,TEAM_Y-9,'#e8c170',14,260); shake(.6,80); if(!G.demo&&!CALM) GONE.push({key:u.key,x,t0:G.time}); dust(x,TEAM_Y,6); burst(x,TEAM_Y-9,['#e8c170','#de9e41'],8); coins(x,TEAM_Y-10,P.fx.reduce((n,f)=>n+(f.k==='gold'?f.n:0),0)); floater(x,TEAM_Y-22,'SOLD','gold'); } }
  else if(src.type==='shop'){
    const merge=canMerge(P.team[dst.i],P.shop[src.i].u); let res;
    if(P.gold<COST) deny('Not enough gold',src);
    else if(!(res=buyUnit(P,src.i,dst.i,G.rng))) deny('Your army is full',src);
    else{ ok=true; const i=slotOf(res.uid), x=teamX(i); floater(24,22,'-'+COST,'spend');
      if(merge){ sfx('merge'); anim(res.uid,'pop'); ring(x,TEAM_Y-9,'#e8c170',15,320); burst(x,TEAM_Y-10,['#e8c170','#ebede9'],10,.08); floater(x,TEAM_Y-24,'+1/+1','buff'); }
      else{ sfx('buy'); anim(res.uid,'land'); dust(x,TEAM_Y,5); sparkle(x,TEAM_Y-8,FACTIONS[UNITS[res.key].faction].color,5); } }
  }
  else if(src.type==='team'){ const merge=canMerge(P.team[dst.i],P.team[src.i]);
    if(moveUnit(P,src.i,dst.i,G.rng)){ ok=true; sfx(merge?'merge':'land'); for(const i of [src.i,dst.i]){ const u=P.team[i]; if(u){ anim(u.uid,merge?'pop':'land'); dust(teamX(i),TEAM_Y,3); } } if(merge){ ring(teamX(dst.i),TEAM_Y-9,'#e8c170',15,320); burst(teamX(dst.i),TEAM_Y-10,['#e8c170','#ebede9'],10,.08); } } }
  else if(src.type==='item'){
    const key=P.items[src.i].item;
    if(P.gold<COST) deny('Not enough gold',src);
    else if(!useItem(P,src.i,dst.i,G.rng)) deny(ITEMS[key].noTarget?'No units to feed':'Needs a valid unit',src);
    else{ ok=true; sfx('buy'); floater(24,22,'-'+COST,'spend'); }
  }
  if(ok&&ice) shatter(ice.x,ice.y);

}

  if(G.sel&&G.sel.type!=='team') G.sel=null; G.hover=null; save(); refreshUI();
}
// Freeze or thaw a card of the hand (the selected one, or else the one under the pointer). Frost creeps over
// the card while it shivers, then sets (see iceOf); thawing breaks the ice off at once.
function doFreeze(h){
  const card=x=>x&&(x.type==='shop'||x.type==='item')&&entityAt(x)?x:null; h=card(h)||card(G.sel)||card(G.hover);
  if(!h||G.screen!=='shop'||G.busy||G.trans) return;
  const e=entityAt(h), id=idOf(e), x=h.type==='shop'?shopX(h.i):itemX(h.i), y=HAND_Y; e.frozen=!e.frozen;
  if(e.frozen){
    sfx('freeze'); floater(x,y-34,'FROZEN','ice');
    // the cold gathers on the card from all around
    for(let i=0;i<18;i++){ const a=i/18*6.283+rnd(-.2,.2), r=rnd(30,46), life=rnd(200,260); part({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r*1.2,vx:-Math.cos(a)*r/life,vy:-Math.sin(a)*r*1.2/life,life,col:i%3?'#a4dddb':'#ebede9',size:i%3?1:2}); }
    if(G.demo||CALM) frosted(x,y,id); else{ ICE.set(id,G.time); anim(id,'chill'); }
  } else { ICE.delete(id); GLINT.delete(id); shatter(x,y); anim(id,'shake'); shake(.8,100); }
  save(); refreshUI();
}
function doSell(){ if(G.sel&&G.sel.type==='team'&&entityAt(G.sel)) act(G.sel,{type:'sell'}); }
$('btnRoll').onclick=doRoll;
$('ctx').addEventListener('click',e=>{ if(e.target.id==='btnSell') doSell(); else if(e.target.id==='btnFreeze') doFreeze(G.sel); });
$('btnEnd').onclick=()=>endTurnFlow();
addEventListener('keydown',e=>{ if(G.screen!=='shop'||G.coll||e.metaKey||e.ctrlKey||!$('modal').classList.contains('hide')) return; const k=e.key.toLowerCase(); if(k==='r') doRoll(); else if(k==='f') doFreeze(); else if(k==='s') doSell(); });

// ---------- flow ----------
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function clearStage(){ G.sel=G.hover=G.drag=null; G.busy=false; T.token++; show('banner',false); show('splash',false); $('fl').innerHTML=''; PT.length=0; FX.length=0; AN.clear(); GHOST.length=0; GONE.length=0; ICE.clear(); GLINT.clear(); CX.clear(); cv.classList.remove('grey'); cv.style.cursor=''; for(const k in HUDV) delete HUDV[k]; }
function enterShop(){
  clearStage(); G.screen='shop'; synSeen='-'; const P=G.P;
  refreshUI(); flushFx(); dropIn(); P.team.forEach((u,i)=>{ if(u) anim(u.uid,'hop',i*60); });
  if(P.turn===1&&P.story) splash(REGIONS[P.story].name.toUpperCase(),'THE CONQUEST OF','',1600);
  else if(P.turn>1&&tierOf(P)>tierOf({fast:P.fast,turn:P.turn-1})){ floater(W/2,60,`TIER ${tierOf(P)} UNLOCKED`,'big'); sfx('level'); flash('#e8c170',200); }
}
function startRun(P){ G.P=P; G.runOver=false; startTurn(P,G.rng); save(); go(enterShop); }
function newSkirmish(){ G.mode='skirmish'; UID=1; startRun(newPlayer()); }
async function endTurnFlow(){
  const P=G.P; if(G.busy||G.trans||G.screen!=='shop') return;
  if(!P.team.some(Boolean)) return deny('Recruit at least one unit first');
  G.busy=true; G.sel=G.hover=G.drag=null;
  endTurn(P,G.rng); const had=P.fx.length; flushFx(); refreshUI(); sfx('end'); P.team.forEach((u,i)=>{ if(u&&!AN.has(u.uid)) anim(u.uid,'hop',i*70); });
  await sleep(had?900:420);
  const story=G.mode==='story', opp=makeOpponent(P.turn,G.rng,story?storyFoe(P):null), sim=simulateBattle(P.team,opp.team,(G.rng()*2147483647)|0);
  const before={gold:P.gold,lives:P.lives,wins:P.wins,turn:P.turn}, mine=P.team.slice();
  if(sim.result==='win') P.wins++; else if(sim.result==='lose') P.lives--;
  const over=P.wins>=P.goal?'victory':P.lives<=0?'defeat':null;
  // the outcome is applied (and saved) before the replay starts, so a reload can't re-roll a battle
  if(over){ G.runOver=true; if(story){ if(over==='victory'){ G.S.conquered.push(P.story); G.S.at=P.story; } save(); } else clearSave(); }
  else{ P.turn++; startTurn(P,G.rng); save(); }
  G.after={over,result:sim.result,turn:before.turn}; G.opp=opp;
  go(()=>{
    clearStage(); G.screen='battle'; G.theme=ARMY_THEME[story?REGIONS[P.story].army:opp.army]||'dusk';
    T.clock=0; T.timers=[]; T.tweens=[]; T.skip=false; T.hold=0; T.slowUntil=0; setSpeed(T.speed);
    setHud(before); $('oppName').textContent=opp.name; $('oppName').className=opp.boss?'boss':''; $('chipsL').innerHTML=chips(mine); $('chipsR').innerHTML=chips(opp.team);
    refreshUI(); playBattle(sim);
  });
}
function showBanner(){
  const a=G.after, P=G.P, r=a.result, R=P.story&&REGIONS[P.story]; T.skip=false;
  const conquered=a.over==='victory'&&R, routed=a.over==='defeat'&&R;
  $('banner').className=r; $('bannerT').textContent=conquered?'CONQUERED!':routed?'ROUTED':r==='win'?'VICTORY':r==='lose'?'DEFEAT':'DRAW';
  $('bannerP').textContent=conquered?`${R.name} is yours`:routed?'Your expedition falls back to regroup':r==='win'?`${P.wins} of ${P.goal} wins`:r==='lose'?`${P.lives} ${P.lives===1?'life':'lives'} left`:'Nobody left standing';
  show('banner',true); setHud({gold:'–',lives:P.lives,wins:P.wins,turn:a.turn}); show('bbar',false);
  if(r==='win'){ confetti(conquered?140:70); flash('#e8c170',250); sfx(conquered?'conquer':'win'); if(conquered) for(let i=0;i<5;i++) setTimeout(()=>G.screen==='battle'&&firework(rnd(60,260),rnd(30,80),1),300+i*350); }
  else{ sfx(r); if(r==='lose'){ cv.classList.add('grey'); shake(2,300); } }
  $('btnCont').focus({preventScroll:true});
}
$('btnCont').onclick=()=>{
  const a=G.after, P=G.P; if(G.trans) return;
  if(!a.over) return go(enterShop);
  if(P.story) return go(()=>enterMap(a.over==='victory'?{won:P.story}:{lost:P.story}));
  const win=a.over==='victory'; show('banner',false);
  modal(`<h2 style="color:${win?'#e8c170':'#cf573c'}">${win?'CONQUEROR!':'YOUR ARMY HAS FALLEN'}</h2><p>${win?`Ten victories in ${a.turn} turns, with ${P.lives} ${P.lives===1?'life':'lives'} to spare. History is yours.`:`You held out for ${a.turn} turns and won ${P.wins} ${P.wins===1?'battle':'battles'}.`}</p><button class="btn gold" id="btnAgain">New Skirmish</button><button class="btn" id="btnQuit">Title</button>`);
  $('btnAgain').onclick=()=>{ closeModal(); newSkirmish(); }; $('btnQuit').onclick=()=>{ closeModal(); go(enterTitle); };
};
function setSpeed(s){ T.speed=s; document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('on',+b.dataset.speed===s)); }
$('bbar').addEventListener('click',e=>{ const b=e.target.closest('[data-speed]'); if(b) setSpeed(+b.dataset.speed); });
$('btnSkip').onclick=()=>{ T.skip=true; $('fl').innerHTML=''; show('splash',false); flushClock(); };

// ---------- story flow ----------
function enterMap(ev){
  clearStage(); G.mode='story'; G.screen='map'; G.runOver=true; const S=G.S, M=G.map, at=REGIONS[S.at], seq=++M.seq;
  M.sel=null; M.path=null; M.then=null; M.fresh=ev&&ev.won||null; M.x=at.x-9; M.y=at.y+2; save(); refreshUI();
  const later=(ms,f)=>setTimeout(()=>{ if(M.seq===seq&&G.screen==='map') f(); },ms);
  if(ev&&ev.won){
    const R=REGIONS[ev.won], f=FACTIONS[R.army];
    later(350,()=>{ splash('CONQUERED',R.name.toUpperCase(),'',1900); sfx('conquer'); flash('#e8c170',300); shake(2.5,350); ring(R.x,R.y,'#e8c170',26,600); ring(R.x,R.y,'#ebede9',16,400); burst(R.x,R.y-8,['#e8c170','#ebede9',f.color],24,.1,700); });
    for(let i=0;i<6;i++) later(600+i*280,()=>firework(R.x+rnd(-40,40),R.y+rnd(-40,-8)));
    later(G.demo?0:2500,()=>{
      const all=S.conquered.length>REGION_KEYS.length;
      modal(`<h2 style="color:${f.color}">THE ${f.name.toUpperCase()} JOIN YOU</h2><div class="unlock">${armyUnits(R.army).map((k,i)=>`<img src="${sprURL(k)}" alt="${UNITS[k].name}" title="${UNITS[k].name}" style="animation-delay:${.15+i*.14}s">`).join('')}</div>
<p>${armyUnits(R.army).map(k=>UNITS[k].name).join(', ')} can now be recruited on every expedition.<br><b>${f.syn}:</b> ${f.tiers[0]}</p><button class="btn gold" id="btnOk">${all?'Claim the world ▸':'Onward ▸'}</button>`);
      confetti(60); sfx('level');
      $('btnOk').onclick=()=>{ closeModal(); if(all) finale(); }; $('btnOk').focus({preventScroll:true});
    });
  } else if(ev&&ev.lost){ const R=REGIONS[ev.lost]; later(400,()=>{ splash('ROUTED','YOUR EXPEDITION WAS','boss',1600); sfx('lose'); shake(2,300); M.sel=ev.lost; refreshUI(); floater(R.x,R.y-30,`${R.name} holds`,'err'); }); }
  else if(!S.intro){ S.intro=true; save();
    modal(`<h2>A CROWN IS NOT ENOUGH</h2><p>Camelot is yours, and so are its peasants and knights. Beyond the sea lie the Norse, Rome, Sparta, Egypt and far Kyoto, each with an army of its own.</p><p><b>Conquer a land and its warriors march with you.</b> Each conquest is a short campaign: raise a fresh army, win the battles, beat the champion. You have 3 lives.</p><button class="btn gold" id="btnOk">To the map ▸</button>`);
    $('btnOk').onclick=closeModal; $('btnOk').focus({preventScroll:true}); }
}
function finale(){
  for(let i=0;i<14;i++) setTimeout(()=>G.screen==='map'&&firework(rnd(30,290),rnd(20,110),1),i*320); confetti(160); sfx('conquer');
  modal(`<h2>EMPEROR OF THE KNOWN WORLD</h2><p>From Camelot to Kyoto, every banner is yours. Seven armies answer one call.</p><p>Take them all into a <b>Skirmish</b> and see how long you last.</p><button class="btn gold" id="btnOk">Glorious</button>`);
  $('btnOk').onclick=closeModal;
}
function march(id){
  const S=G.S, M=G.map; if(M.path||G.trans||!storyOpen(S).includes(id)) return;
  const nodes=storyPath(S,id), pts=[];
  for(let i=0;i<nodes.length-1;i++){ const r=ROUTES.find(r=>(r[0]===nodes[i]&&r[1]===nodes[i+1])||(r[1]===nodes[i]&&r[0]===nodes[i+1])); if(!r) continue; const p=routePts(r,22); pts.push(...(r[0]===nodes[i]?p:p.reverse())); }
  pts.push([REGIONS[id].x+9,REGIONS[id].y+2]);
  M.sel=null; M.path=pts; sfx('drum'); refreshUI();
  M.then=()=>{ sfx('drum'); shake(1.5,200); UID=1; startRun(newPlayer(storyRun(S,id))); };
  if(G.demo){ M.path=null; M.then(); }
}
$('mapcard').addEventListener('click',e=>{ if(e.target.id==='btnMarch') march(G.map.sel); });
function enterTitle(){
  clearStage(); G.screen='title'; const st=loadSave(STORY_KEY), sk=loadSave(SAVE_KEY);
  $('btnStory').textContent=st&&st.S&&(st.S.conquered.length>1||st.P)?'Continue Story':'Story';
  $('btnSkirmish').textContent=sk?'Continue Skirmish':'Skirmish';
  refreshUI();
}
$('btnStory').onclick=()=>{ sfx('buy'); const s=loadSave(STORY_KEY); G.mode='story'; G.S=(s&&s.S)||newStory();
  if(s&&s.P&&s.P.story){ G.P=s.P; UID=s.UID||1000; G.runOver=false; go(enterShop); } else go(()=>enterMap()); };
$('btnSkirmish').onclick=()=>{ sfx('buy'); const s=loadSave(SAVE_KEY);
  if(!s||!s.P) return newSkirmish();
  modal(`<h2>Skirmish</h2><p>You have a run in progress: turn ${s.P.turn}, ${s.P.wins} ${s.P.wins===1?'win':'wins'}, ${s.P.lives} ${s.P.lives===1?'life':'lives'} left.</p><button class="btn gold" id="btnResume">Continue</button><button class="btn" id="btnFresh">New run</button>`);
  $('btnResume').onclick=()=>{ closeModal(); G.mode='skirmish'; G.P=s.P; UID=s.UID||1000; G.runOver=false; go(enterShop); };
  $('btnFresh').onclick=()=>{ closeModal(); newSkirmish(); }; };
$('btnHome').onclick=()=>{
  if(G.trans||G.busy) return;
  if(G.screen==='map'||G.mode==='skirmish') return go(enterTitle);
  modal(`<h2>Retreat?</h2><p>Your army breaks camp and this expedition is abandoned. The land stays unconquered.</p><button class="btn red" id="btnYes">Retreat</button><button class="btn" id="btnNo">Stay</button>`);
  $('btnYes').onclick=()=>{ closeModal(); go(()=>enterMap()); }; $('btnNo').onclick=closeModal;
};

function modal(html){ $('modalBox').innerHTML=html; $('modal').classList.add('hide'); void $('modal').offsetWidth; show('modal',true); }
function closeModal(){ show('modal',false); }
// ---------- collection: every army, unit and item on one screen ----------
const COLL_TABS=[...ARMIES,'items'];
const fmtAll=text=>text.replace(/\{([^}]+)\}/g,(m,s)=>`<b>${s.split('|').join(' / ')}</b>`);
let collTab='medieval';
function collection(tab){
  const k=G.coll=collTab=COLL_TABS.includes(tab)?tab:collTab; let html;
  $('collTabs').innerHTML=COLL_TABS.map(t=>`<button class="btn sm ${t===k?'on':''}" data-tab="${t}">${t==='items'?'Items':FACTIONS[t].name}</button>`).join('');
  if(k==='items'){
    html=`<div class="note">Supplies are used up. Gear stays on the unit; a unit holds one piece and a new one replaces it. Everything costs ${COST} gold.</div>`+
      ITEM_KEYS.map(i=>{ const it=ITEMS[i]; return `<div class="crow"><img class="it" src="${ICON[i].toDataURL()}" alt=""><div class="who"><b>${it.name}</b>${it.gear?'Gear':'Supply'} · Tier ${it.tier}</div><div class="ab">${it.text.replace('Gear: ','').replace(/^./,c=>c.toUpperCase())}</div></div>`; }).join('');
  } else {
    const f=FACTIONS[k], rid=Object.keys(REGIONS).find(id=>REGIONS[id].army===k), R=REGIONS[rid], tiers=f.tiers.filter(Boolean);
    const own=G.mode==='story'&&G.S&&G.screen!=='title'?(G.S.conquered.includes(rid)?' · Yours':' · Not yet conquered'):'';
    html=`<div class="bonus" style="--c:${f.color}"><div class="nm"><b>${f.syn}</b>${R.name}${R.boss?' · '+R.boss[1]:''}${own}</div><div class="tr">${tiers.map((t,i)=>`<div>${tiers.length>1?`<b>(${i?4:2})</b> `:''}${t}</div>`).join('')}</div></div>`+
      armyUnits(k).map(u=>{ const d=UNITS[u]; return `<div class="crow"><img src="${sprURL(u)}" alt=""><div class="who"><b>${d.name}</b>Tier ${d.tier} · <i>${d.atk}/${d.hp}</i></div><div class="ab"><em>${d.ability}.</em> ${fmtAll(d.text)}</div></div>`; }).join('');
    if(k==='egypt') html+=`<div class="crow"><img src="${SPR.medjay.m.toDataURL()}" alt=""><div class="who"><b>${MUMMY.name}</b>Token</div><div class="ab">${MUMMY.text} Raised by Egyptian abilities and the Afterlife bonus; never rises twice.</div></div>`;
  }
  $('collBody').innerHTML=html; show('coll',true); $('coll').scrollTop=0;
}
function closeCollection(){ G.coll=null; show('coll',false); }
$('btnColl').onclick=$('btnBook').onclick=()=>{ if(!G.trans) collection(); };
$('collX').onclick=closeCollection;
$('collTabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) collection(b.dataset.tab); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&G.coll) closeCollection(); });
function help(){
  modal(`<h2>How to Play</h2><ul>
<li><b>Recruit.</b> You get 10 gold a turn. Drag a card from your hand onto your line: units and supplies cost ${COST}, and a fresh hand costs 1.</li>
<li><b>Arrange.</b> Drag units to reorder them. The <b>front</b> of your line is on the right and fights first.</li>
<li><b>Merge.</b> Drop a unit on its twin to combine them. Three copies make level 2, six make level 3, and abilities grow with each level. A gold arrow on a card means it would merge with a unit you field.</li>
<li><b>Armies.</b> Field 2 or 4 units from the same army to switch on its bonus.</li>
<li><b>Story.</b> Start with the Medieval army and march across the map. Win a land's battles and beat its champion to add its army to your recruits.</li>
<li><b>Skirmish.</b> Every army from the start. Win ${WINS} battles before you lose ${LIVES} lives.</li>
<li><b>Freeze.</b> A frozen card stays in your hand through rolls and into the next turn, for free. Select a card and press Freeze, right-click it, or point at it and press F. Do the same again to thaw it.</li>
<li><b>Tips.</b> Drag a unit down onto your hand to sell it. Keys: R roll, F freeze, S sell.</li></ul>
<button class="btn gold" id="btnOk">Got it</button>`);
  $('btnOk').onclick=closeModal; $('btnOk').focus({preventScroll:true});
}
$('modal').addEventListener('click',e=>{ if(e.target===$('modal')&&$('btnOk')) $('btnOk').click(); });
$('btnHelp').onclick=$('btnHow').onclick=help;
$('btnMute').onclick=()=>{ G.muted=!G.muted; $('btnMute').classList.toggle('on',G.muted); $('btnMute').textContent=G.muted?'×':'♪'; };
document.addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest('.btn')&&!e.target.closest('#title')) sfx('click'); },true);

function fit(){ const s=Math.min(innerWidth/W,innerHeight/H); document.documentElement.style.setProperty('--u',(s>=2?Math.floor(s):s)+'px'); }
addEventListener('resize',fit);

async function boot(){
  fit(); buildIcons(); paintCamp(); paintMap(); await loadSprites();
  const ico=mkCanvas(64,64), ix=ico.getContext('2d'); ix.imageSmoothingEnabled=false; ix.drawImage(SPR.knight.n,1,1,16,16,0,0,64,64);
  const link=document.createElement('link'); link.rel='icon'; link.href=ico.toDataURL(); document.head.appendChild(link);
  $('logo').innerHTML=[...'KNIGHT KNIGHT'].map((c,i)=>`<span style="animation-delay:${i*55}ms,${800+i*130}ms">${c===' '?'&nbsp;':c}</span>`).join('');
  enterTitle(); requestAnimationFrame(frame);
  // Screenshot hooks (muted, no transitions or drop-in animations, bot-drafted):
  //   #demo=shop:7  #demo=battle:9  #demo=map:norse,rome  #demo=won:rome (map right after a conquest)
  //   #demo=story:sparta:3 (expedition shop on turn 3)  #demo=boss:norse (the champion battle)
  //   #demo=coll:viking (the collection screen on a tab: an army key or `items`)
  const m=/demo=(shop|battle|map|won|story|boss|coll):?([\w,]*):?(\d*)/.exec(location.hash); if(!m) return;
  G.demo=true; G.muted=true;
  if(m[1]==='coll') return collection(m[2]);
  const draft=(P,n,last)=>{ for(let t=1;t<=n;t++){ P.turn=t; startTurn(P,G.rng); if(t<n||last){ botShop(P,G.rng,P.pool?'medieval':'viking'); if(t<n) endTurn(P,G.rng); } P.fx.length=0; } };
  if(m[1]==='shop'||m[1]==='battle'){ const P=G.P=newPlayer(); G.runOver=false; draft(P,+m[2]||5,m[1]==='battle'); enterShop(); if(m[1]==='battle') endTurnFlow(); return; }
  G.mode='story'; G.S=newStory(); G.S.intro=true;
  if(m[1]==='map'||m[1]==='won'){ const ids=m[2].split(',').filter(k=>REGIONS[k]); ids.forEach(k=>{ G.S.conquered.push(k); G.S.at=k; }); enterMap(m[1]==='won'?{won:ids[ids.length-1]}:null); return; }
  const id=REGIONS[m[2]]?m[2]:'norse', P=G.P=newPlayer(storyRun(G.S,id)); G.runOver=false;
  if(m[1]==='boss'){ draft(P,P.goal,true); P.wins=P.goal-1; enterShop(); endTurnFlow(); } else { draft(P,+m[3]||2,false); enterShop(); }
}
boot();
